                                    <p className="text-sm text-slate-500 mb-6">Esta ação não pode ser desfeita. Digite a senha de administrador para confirmar.</p>
                                    
                                    <input type="password" placeholder="Senha de segurança" autoFocus
                                        value={passwordInput} onChange={e => setPasswordInput(e.target.value)}
                                        className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-center font-bold text-slate-800 mb-4" 
                                    />
                                    
                                    <div className="flex gap-3">
                                        <button onClick={() => { setIsPasswordModalOpen(false); setPasswordInput(''); }} 
                                            className="flex-1 py-2.5 bg-white border border-slate-200 text-slate-700 font-medium rounded-xl hover:bg-slate-50">
                                            Cancelar
                                        </button>
                                        <button onClick={confirmClearAll} 
                                            className="flex-1 py-2.5 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 shadow-md shadow-red-200">
                                            Apagar Tudo
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Modal Settings */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm no-print">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden flex flex-col max-h-[90vh]">
                                <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <Icons.Settings className="w-5 h-5 text-odoo-500"/> Configurações & Backup
                                    </h3>
                                    <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icons.X className="w-5 h-5" />
                                    </button>
                                </div>
                                
                                <div className="p-6 space-y-6 overflow-y-auto">
                                    {/* Preferências */}
                                    <div className="space-y-3">
                                        <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Preferências</h4>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Funcionário <span className="text-red-500">*</span></label>
                                            <input type="text" value={settings.employeeName} onChange={e => setSettings({...settings, employeeName: e.target.value})} 
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-odoo-500 outline-none" />
                                            <p className="text-xs text-slate-400 mt-1">Nome obrigatório para realizar lançamentos.</p>
                                        </div>
                                    </div>

                                    {/* Dados */}
                                    <div className="space-y-3 pt-3 border-t border-slate-100">
                                        <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Gerenciamento de Dados</h4>
                                        <p className="text-xs text-slate-500 mb-2">Salve seus dados em um arquivo seguro para não perdê-los.</p>
                                        
                                        <div className="grid grid-cols-1 gap-3">
                                            <button onClick={triggerRestore} className="flex items-center justify-center gap-2 w-full py-2.5 bg-white text-slate-700 hover:bg-slate-50 font-medium rounded-lg border border-slate-200 transition-colors">
                                                <Icons.Upload className="w-4 h-4" /> Restaurar Backup
                                            </button>
                                            <input 
                                                type="file" 
                                                ref={fileInputRef} 
                                                onChange={handleRestoreFile} 
                                                accept=".json" 
                                                className="hidden" 
                                            />
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="p-4 bg-slate-50 border-t border-slate-100">
                                    <button onClick={() => setIsSettingsOpen(false)} className="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg shadow-sm">
                                        Concluir
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
