                                            <h1 className="font-bold text-slate-800 text-xl leading-tight">
                                                Despesas Miplace
                                            </h1>
                                            <button 
                                                onClick={() => setCurrentView(currentView === 'dashboard' ? 'calendar' : 'dashboard')} 
                                                className="focus:outline-none transition-transform active:scale-95 flex items-center justify-center"
                                                title={currentView === 'dashboard' ? "Ver Calendário" : "Voltar para Lista"}
                                            >
                                                {currentView === 'dashboard' ? (
                                                    <CalendarIcon3D />
                                                ) : (
                                                    <HomeIcon3D />
                                                )}
                                            </button>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <p className="text-xs text-slate-500 font-medium tracking-wide mt-0.5">Registro Profissional</p>
                                            {settings.employeeName !== "Seu Nome" && (
                                                <span className="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold border border-emerald-200">
                                                    Conectado: {settings.employeeName}
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                <div className="flex items-center gap-3">
                                    <button onClick={handleBackupClick} className="focus:outline-none transition-transform active:scale-95 p-1" title="Salvar Backup">
                                        <FloppyDiskIcon3D />
                                    </button>
                                    <button onClick={() => setIsSettingsOpen(true)} className="focus:outline-none transition-transform active:scale-95 p-1" title="Configurações">
                                        <SettingsIcon3D />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-5xl mx-auto px-6 space-y-8 mt-4">
                        
                        {currentView === 'calendar' ? (
                            <ExpenseCalendar 
                                checkedState={calendarChecks} 
                                onToggleCheck={handleCalendarCheckToggle} 
                                showToast={showToast} 
                            />
                        ) : (
                            <>
                                {expenses.length > 0 && (
                                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 no-print fade-in">
                                        {Object.entries(totalsByStore)
                                            .sort((a, b) => b[1] - a[1]) // Maior gasto primeiro
                                            .map(([storeName, val]) => (
                                            <div key={storeName} className="glass-panel p-4 rounded-2xl hover:translate-y-[-4px] transition-transform duration-300">
                                                <div className="flex items-center gap-2 mb-2">
                                                    <img src={STORE_IMAGES[storeName] || STORE_IMAGES["default"]} alt={storeName} className="w-6 h-6 rounded-full" />
                                                    <span className="text-[10px] uppercase font-bold text-slate-400 truncate block tracking-wide">{storeName}</span>
                                                </div>
                                                <span className="text-xl font-bold text-slate-700 block mb-3">{settings.currency} {formatCurrency(val)}</span>
                                                <div className={`h-1.5 w-full rounded-full bg-gradient-to-r opacity-80 ${getStoreBarColor(storeName)}`}></div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <div className="glass-panel rounded-3xl overflow-hidden no-print">
                                    <div className="p-8">
                                        <div className="flex justify-between items-center mb-8">
                                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-4">
                                                {editingId ? (
                                                    <div className="p-2.5 rounded-xl shadow-md bg-orange-100 text-orange-600">
                                                        <Icons.Edit className="w-6 h-6"/>
                                                    </div>
                                                ) : (
                                                    <FastForwardIcon3D />
                                                )}
                                                {editingId ? "Editar Lançamento" : "Novo Lançamento"}
                                            </h2>
                                            {editingId && (
                                                <button onClick={cancelEdit} className="bg-white/50 border border-white/60 px-4 py-2 rounded-xl text-xs font-bold text-slate-500 hover:text-red-500 transition-colors">
                                                    Cancelar
                                                </button>
                                            )}
                                        </div>

                                        <form onSubmit={handleSubmit} className="space-y-6">
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <div className="space-y-2">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wide ml-1">Data</label>
                                                    <DateInput 
                                                        required 
                                                        value={date} 
                                                        onChange={e => setDate(e.target.value)}
                                                        className="liquid-input w-full px-5 py-3.5 rounded-xl text-slate-700 font-semibold" 
                                                    />
                                                </div>

                                                <div className="space-y-2">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wide ml-1">Categoria</label>
                                                    <div className="relative group">
                                                        <select required value={category} onChange={e => setCategory(e.target.value)}
                                                            className="liquid-input w-full px-5 py-3.5 rounded-xl appearance-none text-slate-700 font-semibold cursor-pointer">
                                                            <option value="" disabled>Selecione...</option>
                                                            {settings.categories.map((c, i) => <option key={i} value={c.label}>{c.label}</option>)}
                                                        </select>
                                                        <div className="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 group-hover:text-blue-500 transition-colors">
                                                            <Icons.Tag className="w-4 h-4" />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="space-y-2 md:col-span-2">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wide ml-1">Descrição</label>
                                                    <input type="text" required placeholder="Ex: Café com cliente" value={description} onChange={e => setDescription(e.target.value)}
                                                        className="liquid-input w-full px-5 py-3.5 rounded-xl text-slate-700 font-semibold placeholder-slate-400" />
                                                </div>

                                                <div className="space-y-2">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wide ml-1">Loja / Grupo</label>
                                                    <div className="relative group">
                                                        <select required value={store} onChange={e => setStore(e.target.value)}
                                                            className="liquid-input w-full px-5 py-3.5 rounded-xl appearance-none text-slate-700 font-semibold cursor-pointer">
                                                            <option value="" disabled>Selecione...</option>
                                                            {STORES_LIST.map((l, i) => <option key={i} value={l}>{l}</option>)}
                                                        </select>
                                                        <div className="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 group-hover:text-blue-500 transition-colors">
                                                            <Icons.Store className="w-4 h-4" />
                                                        </div>
                                                    </div>
                                                    {!editingId && store.includes("Piracicaba") && <p className="text-[10px] text-red-500 font-bold px-3 pt-1 animate-pulse">* Divide por 3</p>}
                                                    {!editingId && store.includes("Amparo") && <p className="text-[10px] text-pink-500 font-bold px-3 pt-1 animate-pulse">* Divide por 2</p>}
                                                    {!editingId && store === "Todas" && <p className="text-[10px] text-green-600 font-bold px-3 pt-1 animate-pulse">* Divide por 5</p>}
                                                </div>

                                                <div className="space-y-2">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wide ml-1">Valor ({settings.currency})</label>
                                                    <div className="relative group">
                                                        <input type="text" inputMode="numeric" required placeholder="0,00" value={amount} onChange={handleAmountChange}
                                                            className="liquid-input w-full pl-5 pr-12 py-3.5 rounded-xl text-slate-700 font-bold text-lg" />
                                                         <div className="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 group-hover:text-blue-500 transition-colors">
                                                            <Icons.DollarSign className="w-4 h-4" />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="space-y-2 md:col-span-2">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wide ml-1">Observações (Opcional)</label>
                                                    <input type="text" value={notes} onChange={e => setNotes(e.target.value)}
                                                        className="liquid-input w-full px-5 py-3.5 rounded-xl text-slate-600 font-medium text-sm placeholder-slate-400" />
                                                </div>
                                            </div>

                                            <button type="submit" className={`w-full py-4 px-6 rounded-full font-bold text-white text-base transform transition-all active:scale-[0.98] flex items-center justify-center gap-2 mt-4 ${editingId ? 'bg-gradient-to-r from-orange-400 to-amber-500 shadow-lg rounded-2xl' : 'liquid-btn-3d'}`}>
                                                {editingId ? <Icons.Check className="w-5 h-5"/> : <Icons.Plus className="w-5 h-5"/>}
                                                {editingId ? "Salvar Alterações" : "Adicionar Despesa"}
                                            </button>
                                        </form>
                                    </div>
                                </div>

                                {expenses.length > 0 && (
                                    <div className="glass-panel p-6 rounded-3xl flex flex-col gap-8 print:border-none print:shadow-none print:p-0 print:mb-6">
                                        <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                                            <div className="text-center md:text-left">
                                                <p className="text-xs text-slate-400 uppercase font-bold mb-2 no-print tracking-widest">Total Geral</p>
                                                <p className="text-4xl font-extrabold text-slate-800 tracking-tight drop-shadow-sm">
                                                    <span className="text-xl text-slate-400 font-bold mr-1 align-top relative top-1">{settings.currency}</span>
                                                    {formatCurrency(totalGeneral)}
                                                </p>
                                                <div className="mt-2 inline-block no-print">
                                                     <span className="text-xs font-bold text-slate-500 bg-white/60 border border-white px-3 py-1 rounded-full shadow-sm">{filteredExpenses.length} registros</span>
                                                </div>
                                            </div>
                                            <div className="flex gap-4 w-full md:w-auto no-print">
                                                <button onClick={() => setIsPasswordModalOpen(true)} className="flex-1 md:flex-none justify-center flex items-center gap-2 px-5 py-3 bg-white/40 hover:bg-red-50 border border-white/60 hover:border-red-200 rounded-xl text-slate-500 hover:text-red-500 font-bold transition-all shadow-sm">
                                                    <Icons.Trash2 className="w-4 h-4" /> Limpar
                                                </button>
                                                <button onClick={() => window.print()} className="flex-1 md:flex-none justify-center flex items-center gap-2 px-5 py-3 bg-white/60 hover:bg-white border border-white/80 rounded-xl text-slate-600 font-bold transition-all shadow-sm">
                                                    <Icons.Printer className="w-4 h-4" /> Imprimir
                                                </button>
                                                <button onClick={exportToCSV} className="flex-1 md:flex-none justify-center flex items-center gap-2 px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl shadow-lg shadow-emerald-200/50 font-bold transition-transform hover:-translate-y-0.5">
                                                    <Icons.Download className="w-4 h-4" /> Exportar
                                                </button>
                                            </div>
                                        </div>
                                        
                                        <div className="flex flex-col md:flex-row gap-6 no-print items-end md:items-center bg-white/30 p-4 rounded-2xl border border-white/40">
                                            <div className="relative flex-1 w-full group">
                                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                                    <Icons.Search className="w-5 h-5 text-slate-400" />
                                                </div>
                                                <input 
                                                    type="text" 
                                                    placeholder="Pesquisar..." 
                                                    value={searchTerm}
                                                    onChange={e => setSearchTerm(e.target.value)}
                                                    className="w-full pl-11 pr-4 py-2.5 bg-white/60 border border-white rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm font-medium text-slate-600 placeholder-slate-400"
                                                />
                                            </div>
                                            
                                            <div className="flex flex-wrap gap-4 w-full md:w-auto items-center">
                                                <div className="flex items-center gap-2 bg-white/60 p-1.5 rounded-xl border border-white shadow-sm relative">
                                                    <div className="w-32">
                                                        <DateInput 
                                                            value={filterDate} 
                                                            onChange={(e) => setFilterDate(e.target.value)}
                                                            className="w-full bg-transparent text-xs font-bold text-slate-600 outline-none px-2 py-1 cursor-pointer rounded-lg hover:bg-white/50 transition-colors"
                                                            placeholder="Filtrar Data"
                                                        />
                                                    </div>
                                                    {filterDate && (
                                                        <button onClick={() => setFilterDate('')} className="absolute -right-2 -top-2 bg-red-500 text-white rounded-full p-1 shadow-md hover:bg-red-600 z-10 transition-transform hover:scale-110">
                                                            <Icons.X className="w-3 h-3"/>
                                                        </button>
                                                    )}
                                                </div>

                                                <div className="h-6 w-px bg-slate-300 hidden md:block"></div>

                                                <div className="flex bg-white/60 p-1 rounded-xl border border-white shadow-sm">
                                                    <button 
                                                        onClick={() => setGroupBy('date')}
                                                        className={`px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${groupBy === 'date' ? 'bg-gradient-to-r from-blue-500 to-indigo-500 text-white shadow-md' : 'text-slate-500 hover:text-slate-800'}`}
                                                    >
                                                        Data
                                                    </button>
                                                    <button 
                                                        onClick={() => setGroupBy('store')}
                                                        className={`px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${groupBy === 'store' ? 'bg-gradient-to-r from-blue-500 to-indigo-500 text-white shadow-md' : 'text-slate-500 hover:text-slate-800'}`}
                                                    >
                                                        Loja
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {expenses.length > 0 && (
                                    <div className="space-y-8 print:space-y-6">
                                        {groupedExpenses.map(group => (
                                            <div key={group.key} className="print-break-inside-avoid">
                                                <div className="flex items-center justify-between mb-4 px-2">
                                                    <h3 className="text-lg font-bold text-slate-700 flex items-center gap-3">
                                                        <div className="bg-white/80 p-2 rounded-xl shadow-sm text-blue-500 border border-white">
                                                            {groupBy === 'date' ? <Icons.Calendar className="w-5 h-5" /> : (
                                                                <img src={STORE_IMAGES[group.key] || STORE_IMAGES["default"]} alt={group.key} className="w-5 h-5 rounded-full" />
                                                            )}
                                                        </div>
                                                        {groupBy === 'date' ? formatDateBR(group.key) : group.key}
                                                    </h3>
                                                    <span className="text-sm font-bold text-slate-600 bg-white/60 px-4 py-1.5 rounded-full border border-white shadow-sm">
                                                        {settings.currency} {formatCurrency(group.total)}
                                                    </span>
                                                </div>

                                                <div className="glass-panel rounded-2xl overflow-hidden print:shadow-none print:border print:border-slate-300 p-0">
                                                    <div className="overflow-x-auto max-h-[500px] overflow-y-auto print-scroll-fix">
                                                        <table className="w-full text-left text-sm relative border-collapse">
                                                            <thead className="sticky top-0 z-10 bg-white/80 backdrop-blur-md border-b border-white">
                                                                <tr>
                                                                    {groupBy === 'date' && <th className="px-6 py-4 font-bold text-slate-400 uppercase text-[10px] tracking-widest">Loja</th>}
                                                                    <th className="px-6 py-4 font-bold text-slate-400 uppercase text-[10px] tracking-widest">Quem</th>
                                                                    <th className="px-6 py-4 font-bold text-slate-400 uppercase text-[10px] tracking-widest">Categoria</th>
                                                                    <th className="px-6 py-4 font-bold text-slate-400 uppercase text-[10px] tracking-widest">Data</th>
                                                                    <th className="px-6 py-4 font-bold text-slate-400 uppercase text-[10px] tracking-widest">Descrição</th>
                                                                    <th className="px-6 py-4 font-bold text-slate-400 uppercase text-[10px] tracking-widest text-right">Valor</th>
                                                                    <th className="px-6 py-4 font-bold text-slate-400 uppercase text-[10px] tracking-widest text-center no-print">Opções</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody className="divide-y divide-slate-100">
                                                                {group.items.map((ex, idx) => (
                                                                    <tr key={ex.id} className="hover:bg-blue-50/40 transition-colors group">
                                                                        {groupBy === 'date' && (
                                                                            <td className="px-6 py-4 whitespace-nowrap">
                                                                                <span className={`inline-flex items-center px-3 py-1 rounded-lg text-[10px] font-bold shadow-sm border border-white/50 backdrop-blur-sm ${getStoreColorClass(ex.store)}`}>
                                                                                    {ex.store}
                                                                                </span>
                                                                            </td>
                                                                        )}
                                                                        <td className="px-6 py-4 text-slate-600 font-medium text-xs">{ex.employeeName || settings.employeeName}</td>
                                                                        <td className="px-6 py-4 text-slate-600 text-xs font-medium"><span className="bg-white/60 border border-white px-2 py-1 rounded-md shadow-sm">{ex.category}</span></td>
                                                                        <td className="px-6 py-4 whitespace-nowrap text-slate-500 font-medium text-xs">
                                                                            {formatDateBR(ex.date)}
                                                                        </td>
                                                                        <td className="px-6 py-4">
                                                                            <div className="font-semibold text-slate-700 leading-tight">
                                                                                {ex.description}
                                                                            </div>
                                                                            {ex.notes && (
                                                                                <div className="text-xs text-slate-400 mt-1 italic">
                                                                                    {ex.notes}
                                                                                </div>
                                                                            )}
                                                                        </td>
                                                                        <td className="px-6 py-4 text-right font-bold text-slate-700 tabular-nums">
                                                                            <div className="flex flex-col items-end">
                                                                                <span>{formatCurrency(ex.amount)}</span>
                                                                                {ex.originalTotal && (
                                                                                    <span className="text-[9px] text-slate-400 font-medium bg-white/80 px-1.5 py-0.5 rounded shadow-sm mt-1 border border-white">
                                                                                        Orig: {formatCurrency(ex.originalTotal)}
                                                                                    </span>
                                                                                )}
                                                                            </div>
                                                                        </td>
                                                                        <td className="px-6 py-4 text-center no-print">
                                                                            <div className="flex justify-center gap-2 opacity-0 group-hover:opacity-100 transition-all transform translate-y-1 group-hover:translate-y-0">
                                                                                <button onClick={() => duplicateExpense(ex)} className="p-1.5 text-slate-400 hover:text-blue-500 bg-white/50 hover:bg-white border border-transparent hover:border-blue-100 rounded-lg transition-all shadow-sm" title="Duplicar">
                                                                                    <Icons.Copy className="w-4 h-4" />
                                                                                </button>
                                                                                <button onClick={() => startEdit(ex)} className="p-1.5 text-slate-400 hover:text-orange-500 bg-white/50 hover:bg-white border border-transparent hover:border-orange-100 rounded-lg transition-all shadow-sm" title="Editar">
                                                                                    <Icons.Edit className="w-4 h-4" />
                                                                                </button>
                                                                                <button onClick={() => confirmDeleteExpense(ex.id)} className="p-1.5 text-slate-400 hover:text-red-500 bg-white/50 hover:bg-white border border-transparent hover:border-red-100 rounded-lg transition-all shadow-sm" title="Excluir">
                                                                                    <Icons.Trash2 className="w-4 h-4" />
                                                                                </button>
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                {expenses.length === 0 && (
                                    <div className="text-center py-24 rounded-3xl border-2 border-dashed border-slate-300/60 no-print flex flex-col items-center justify-center text-slate-400 bg-white/20 backdrop-blur-sm">
                                        <div className="bg-white/60 p-6 rounded-full mb-4 shadow-liquid-glow"><Icons.FileSpreadsheet className="w-10 h-10 text-blue-300"/></div>
                                        <p className="font-bold text-slate-600 text-lg">Tudo limpo por aqui.</p>
                                        <p className="text-sm opacity-70 mt-1">Utilize o formulário acima para adicionar despesas.</p>
                                    </div>
                                )}
                            </>
                        )}
                    </div>

                    {showBackupOptions && (
                         <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/20 backdrop-blur-md p-4 animate-in fade-in zoom-in no-print">
                            <div className="glass-panel w-full max-w-sm overflow-hidden relative rounded-3xl shadow-2xl p-8 text-center">
                                <div className="mx-auto w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center mb-5 shadow-inner text-blue-500">
                                    <Icons.Save className="w-7 h-7" />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">Salvar Backup</h3>
                                <p className="text-sm text-slate-500 mb-8 font-medium">Onde deseja salvar seus dados?</p>
                                
                                <div className="grid grid-cols-1 gap-3">
                                    <button onClick={saveToComputer} className="group relative w-full py-4 bg-white/60 border border-white hover:bg-white hover:border-blue-200 text-slate-700 font-bold rounded-xl shadow-sm transition-all flex items-center justify-center gap-3">
                                        <div className="p-2 bg-slate-100 rounded-lg group-hover:bg-blue-50 text-slate-500 group-hover:text-blue-500 transition-colors">
                                            <Icons.HardDrive className="w-5 h-5" />
                                        </div>
                                        <span className="flex-1 text-left">No Computador</span>
                                        <Icons.Download className="w-4 h-4 text-slate-400 mr-2" />
                                    </button>

                                    <button onClick={saveToCloud} className="group relative w-full py-4 bg-white/60 border border-white hover:bg-white hover:border-emerald-200 text-slate-700 font-bold rounded-xl shadow-sm transition-all flex items-center justify-center gap-3">
                                        <div className="p-2 bg-slate-100 rounded-lg group-hover:bg-emerald-50 text-slate-500 group-hover:text-emerald-500 transition-colors">
                                            <Icons.CloudUpload className="w-5 h-5" />
                                        </div>
                                        <span className="flex-1 text-left">Na Nuvem (Manual)</span>
                                        <span className="text-[10px] bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded-md font-bold mr-2">Online</span>
                                    </button>
                                </div>

                                <button onClick={() => setShowBackupOptions(false)} className="mt-6 text-slate-400 hover:text-slate-600 text-xs font-bold uppercase tracking-wider">
                                    Cancelar
                                </button>
                            </div>
                        </div>
                    )}
                    
                    {showReminder && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/20 backdrop-blur-md p-4 animate-in fade-in zoom-in no-print">
                            <div className="glass-panel w-full max-w-sm overflow-hidden relative rounded-3xl shadow-2xl">
                                <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-red-400 to-orange-400"></div>
                                <div className="p-8">
                                    <div className="flex items-center gap-4 mb-6">
                                        <div className="w-12 h-12 bg-red-50 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-inner text-red-500">
                                            <Icons.Bell className="w-6 h-6" />
                                        </div>
                                        <h3 className="text-xl font-bold text-slate-800 leading-tight">Pagamentos Pendentes!</h3>
                                    </div>
                                    <div className="bg-white/50 rounded-2xl border border-white/60 p-4 mb-6 max-h-48 overflow-y-auto custom-scrollbar shadow-inner">
                                        <ul className="space-y-3">
                                            {pendingItems.map((item, idx) => (
                                                <li key={idx} className="flex items-center gap-3 text-sm font-semibold text-slate-700">
                                                    <Icons.AlertCircle className="w-4 h-4 text-orange-500 flex-shrink-0" />
                                                    {item.description} <span className="text-xs text-slate-500 bg-white/80 px-2 py-0.5 rounded-md border border-slate-100 shadow-sm">Dia {item.day}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                    <button 
                                        onClick={() => { setShowReminder(false); setCurrentView('calendar'); }} 
                                        className="w-full py-3.5 bg-gradient-to-r from-red-500 to-orange-500 hover:from-red-600 hover:to-orange-600 text-white font-bold rounded-xl shadow-lg shadow-red-200 transition-all flex items-center justify-center gap-2 transform hover:scale-[1.02]"
                                    >
                                        Resolver Agora <Icons.ChevronRight className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {deleteModalState.open && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/20 backdrop-blur-md fade-in no-print">
                            <div className="glass-panel w-full max-w-sm overflow-hidden transform transition-all scale-100 p-8 text-center rounded-3xl">
                                <div className={`mx-auto w-14 h-14 rounded-2xl flex items-center justify-center mb-5 shadow-sm border border-white ${deleteModalState.step === 1 ? 'bg-orange-50 text-orange-500' : 'bg-red-50 text-red-500'}`}>
                                    {deleteModalState.step === 1 ? <Icons.AlertTriangle className="w-7 h-7"/> : <Icons.Trash2 className="w-7 h-7"/>}
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">
                                    {deleteModalState.step === 1 ? "Confirmar?" : "Atenção!"}
                                </h3>
                                <p className="text-sm text-slate-600 mb-8 px-2 leading-relaxed">
                                    {deleteModalState.step === 1 ? "Deseja realmente excluir este lançamento?" : "Os dados serão excluídos definitivamente. Está de acordo?"}
                                </p>
                                <div className="flex gap-3">
                                    <button onClick={closeDeleteModal} className="flex-1 py-3 bg-white/50 border border-white/60 text-slate-700 font-bold rounded-xl hover:bg-white/80 transition-colors">Não</button>
                                    <button onClick={handleDeleteStep} className={`flex-1 py-3 text-white font-bold rounded-xl shadow-lg transition-transform hover:-translate-y-0.5 ${deleteModalState.step === 1 ? 'bg-orange-400 hover:bg-orange-500' : 'bg-red-500 hover:bg-red-600'}`}>Sim</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isPasswordModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/20 backdrop-blur-md fade-in no-print">
                            <div className="glass-panel w-full max-w-sm overflow-hidden p-8 text-center rounded-3xl">
                                <div className="mx-auto w-14 h-14 bg-red-50 rounded-2xl flex items-center justify-center mb-5 rotate-12 shadow-sm border border-white text-red-500">
                                    <Icons.Trash2 className="w-7 h-7" />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">Apagar Tudo?</h3>
                                <p className="text-sm text-slate-500 mb-6 font-medium">Digite a senha de administrador.</p>
                                <input type="password" placeholder="Senha" autoFocus
                                    value={passwordInput} onChange={e => setPasswordInput(e.target.value)}
                                    className="liquid-input w-full px-5 py-3 rounded-xl text-center font-bold text-slate-700 mb-6 placeholder-slate-300" 
                                />
                                <div className="flex gap-3">
                                    <button onClick={() => { setIsPasswordModalOpen(false); setPasswordInput(''); }} className="flex-1 py-3 bg-white/50 border border-white/60 text-slate-700 font-bold rounded-xl hover:bg-white/80 transition-colors">Cancelar</button>
                                    <button onClick={confirmClearAll} className="flex-1 py-3 bg-red-500 text-white font-bold rounded-xl hover:bg-red-600 shadow-lg shadow-red-200 transition-colors">Apagar</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/20 backdrop-blur-md no-print">
                            <div className="glass-panel w-full max-w-sm overflow-hidden flex flex-col max-h-[90vh] rounded-3xl border border-white/80 shadow-2xl">
                                <div className="p-5 border-b border-white/60 flex justify-between items-center bg-white/40">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <div className="p-1.5 bg-blue-100/50 rounded-lg text-blue-600"><Icons.Settings className="w-5 h-5"/></div>
                                        Configurações
                                    </h3>
                                    <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-slate-600 bg-white/50 p-1.5 rounded-lg transition-colors">
                                        <Icons.X className="w-5 h-5" />
                                    </button>
                                </div>
                                
                                <div className="p-6 space-y-8 overflow-y-auto">
                                    <div className="space-y-3">
                                        <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Perfil</h4>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-2">Nome do Funcionário <span className="text-red-500">*</span></label>
                                            <input type="text" value={settings.employeeName} onChange={e => setSettings({...settings, employeeName: e.target.value})} 
                                                className="liquid-input w-full p-3.5 rounded-xl font-medium text-slate-700" />
                                        </div>
                                    </div>

                                    <div className="space-y-3 pt-4 border-t border-slate-100">
                                        <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Dados & Backup</h4>
                                        
                                        <div className="grid grid-cols-1 gap-3">
                                            <button onClick={triggerRestore} className="flex items-center justify-center gap-2 w-full py-3.5 bg-white/60 text-slate-600 hover:text-blue-600 hover:bg-white border border-white rounded-xl transition-all shadow-sm">
                                                <Icons.Upload className="w-5 h-5" /> Restaurar Arquivo (PC)
                                            </button>
                                            <input type="file" ref={fileInputRef} onChange={handleRestoreFile} accept=".json" className="hidden" />

                                            <button onClick={handleCloudRestore} className="flex items-center justify-center gap-2 w-full py-3.5 bg-emerald-50 text-emerald-600 hover:text-emerald-700 hover:bg-emerald-100 border border-emerald-100 rounded-xl transition-all shadow-sm">
                                                <Icons.Cloud className="w-5 h-5" /> Baixar da Nuvem (Manual)
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="p-5 bg-white/30 border-t border-white/60">
                                    <button onClick={() => setIsSettingsOpen(false)} className="w-full py-3.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow-lg transition-transform hover:-translate-y-0.5">
                                        Concluir
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
