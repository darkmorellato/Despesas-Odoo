        body {

            border: 2px solid transparent;
            background-clip: content-box;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.8); }

        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05), inset 0 0 20px rgba(255,255,255,0.5);
        }

        .liquid-btn-primary {
            background: linear-gradient(135deg, #60A5FA 0%, #3B82F6 100%);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), 0 4px 12px rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .liquid-btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.8), 0 6px 16px rgba(59, 130, 246, 0.4), 0 0 10px rgba(59, 130, 246, 0.2);
        }
        
        .liquid-btn-3d {
            background: linear-gradient(180deg, #3B82F6 0%, #1D4ED8 100%);
            border-radius: 9999px;
            border: none;
            box-shadow: 
                inset 0 3px 5px rgba(255,255,255,0.4),
                inset 0 -3px 5px rgba(0,0,0,0.2),
                0 8px 20px rgba(37, 99, 235, 0.4);
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .liquid-btn-3d::before {
            content: "";
            position: absolute;
            top: 3px;
            left: 5%;
            width: 90%;
            height: 40%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.05) 100%);
            border-radius: 9999px;
            pointer-events: none;
        }

        .liquid-btn-3d:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 
                inset 0 3px 5px rgba(255,255,255,0.6), 
                inset 0 -3px 5px rgba(0,0,0,0.2),
                0 12px 25px rgba(37, 99, 235, 0.5);
        }

        .liquid-btn-3d:active {
            transform: translateY(1px);
            box-shadow: 
                inset 0 2px 4px rgba(0,0,0,0.3),
                0 4px 10px rgba(37, 99, 235, 0.3);
        }

        .liquid-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
        }
        .liquid-input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15), inset 0 1px 2px rgba(0,0,0,0.03);
            outline: none;
        }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .glass-panel, .liquid-btn-primary, .liquid-input, .liquid-btn-3d { 
                background: white !important; 
                box-shadow: none !important; 
                border: 1px solid #ddd !important;
                backdrop-filter: none !important;

            }

            .print-scroll-fix { max-height: none !important; overflow: visible !important; }

        }

            employeeName: "Seu Nome",
            currency: "R$",
            categories: CATEGORIES_LIST.map(cat => ({ label: cat, odooRef: cat }))
        };

        const getTodayLocal = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const formatDateBR = (dateString) => {
            if (!dateString) return "";
            const [year, month, day] = dateString.split('-');
            return `${day}/${month}/${year}`;
        };

        const formatCurrency = (value) => {
            return new Intl.NumberFormat('pt-BR', { style: 'decimal', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value);
        };

        // --- Componentes UI ---
        const DateInput = ({ value, onChange, required, className, placeholder = "dd/mm/aaaa" }) => {
            const [inputType, setInputType] = useState('text');

            return (
                <div className="relative w-full group">
                    <input
                        type={inputType}
                        required={required}
                        value={inputType === 'text' && value ? formatDateBR(value) : value}
                        onChange={onChange}
                        onFocus={(e) => {
                            setInputType('date');
                            if (e.target.showPicker) {
                                try { e.target.showPicker(); } catch (err) {}
                            }
                        }}
                        onBlur={() => setInputType('text')}
                        placeholder={placeholder}
                        className={className}
                    />
                    {inputType === 'text' && (
                        <div className="absolute right-4 top-1/2 transform -translate-y-1/2 pointer-events-none text-blue-400 group-hover:text-blue-600 transition-colors">
                            <Icons.Calendar className="w-5 h-5 drop-shadow-sm" />
                        </div>
                    )}
                </div>
            );
        };

        const ToastContainer = ({ toasts, removeToast }) => (
            <div className="fixed top-4 right-4 z-[60] flex flex-col gap-3 pointer-events-none">
                {toasts.map(toast => (
                    <div key={toast.id} className={`pointer-events-auto flex items-center gap-3 px-5 py-4 rounded-2xl shadow-liquid-card transform transition-all duration-300 animate-in slide-in-from-right fade-in backdrop-blur-md border ${
                        toast.type === 'error' ? 'bg-red-50/80 border-red-200 text-red-700' : 
                        toast.type === 'success' ? 'bg-emerald-50/80 border-emerald-200 text-emerald-700' : 'bg-blue-50/80 border-blue-200 text-blue-700'
                    }`}>
                        <div className={`p-2 rounded-full shadow-sm ${
                             toast.type === 'error' ? 'bg-white/50 text-red-500' : 
                             toast.type === 'success' ? 'bg-white/50 text-emerald-500' : 'bg-white/50 text-blue-500'
                        }`}>
                            {toast.type === 'error' ? <Icons.AlertCircle className="w-5 h-5"/> : 
                             toast.type === 'success' ? <Icons.Check className="w-5 h-5"/> : 
                             <Icons.AlertCircle className="w-5 h-5"/>}
                        </div>
                        <div>
                            <p className="font-semibold text-sm drop-shadow-sm">{toast.message}</p>
                        </div>
                        <button onClick={() => removeToast(toast.id)} className="opacity-60 hover:opacity-100 ml-2">
                            <Icons.X className="w-4 h-4" />
                        </button>
                    </div>
                ))}
            </div>
        );

        let globalAudioCtx = null;
        const initAudioContext = () => {
            if (!globalAudioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    globalAudioCtx = new AudioContext();
                }
            }
            if (globalAudioCtx && globalAudioCtx.state === 'suspended') {
                globalAudioCtx.resume();
            }
            return globalAudioCtx;
        };

        // --- Componente de Calendário (Checklist) ---
        const ExpenseCalendar = ({ checkedState, onToggleCheck, showToast }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [zoomLevel, setZoomLevel] = useState(1); 
            
            const [confirmPayModal, setConfirmPayModal] = useState({ open: false, desc: null });
            const [modalPosition, setModalPosition] = useState({ x: 0, y: 0 });
            const [fixModal, setFixModal] = useState({ open: false, desc: null });
            const [fixPassword, setFixPassword] = useState('');

            const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            const getFirstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const daysInMonth = getDaysInMonth(year, month);
            const firstDay = getFirstDayOfMonth(year, month);

            const handlePrevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
            const handleNextMonth = () => setCurrentDate(new Date(year, month + 1, 1));
            const handleToday = () => setCurrentDate(new Date());

            const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

            const setCheckStatus = (desc, status) => {
                const key = `${year}-${month}-${desc}`;
                onToggleCheck(key, status);
            };

            const initiatePayment = (desc, e) => {
                // Removemos o cálculo de posição, agora é centralizado via CSS
                setConfirmPayModal({ open: true, desc });
            };

            const confirmPayment = () => {
                if (confirmPayModal.desc) {
                    setCheckStatus(confirmPayModal.desc, true);
                    setConfirmPayModal({ open: false, desc: null });
                    if(showToast) showToast("Marcado como Pago!", "success");
                }
            };

            const initiateFix = (desc) => {
                setFixModal({ open: true, desc });
                setFixPassword('');
            };

            const confirmFix = () => {
                if (fixPassword === "#Banana@10") {
                    setCheckStatus(fixModal.desc, false);
                    setFixModal({ open: false, desc: null });
                    if(showToast) showToast("Correção realizada.", "success");
                } else {
                    if(showToast) showToast("Senha incorreta.", "error");
                }
            };

            const getDayColorStyles = (day) => {
                switch(day) {
                    case 5: return 'bg-blue-50/50 border-blue-200 hover:bg-blue-100/50';
                    case 10: return 'bg-emerald-50/50 border-emerald-200 hover:bg-emerald-100/50';
                    case 15: return 'bg-orange-50/50 border-orange-200 hover:bg-orange-100/50';
                    case 20: return 'bg-yellow-50/50 border-yellow-200 hover:bg-yellow-100/50';
                    case 25: return 'bg-red-50/50 border-red-200 hover:bg-red-100/50';
                    case 27: return 'bg-purple-50/50 border-purple-200 hover:bg-purple-100/50';
                    default: return 'bg-white/30 border-white/50 hover:bg-white/60';
                }
            };

            const getDueDateBadgeColor = (day, isChecked) => {
                if (isChecked) return 'bg-slate-100 text-slate-400 border-slate-200';
                switch(day) {
                    case 5: return 'bg-blue-50 text-blue-600 border-blue-100';
                    case 10: return 'bg-emerald-50 text-emerald-600 border-emerald-100';
                    case 15: return 'bg-orange-50 text-orange-600 border-orange-100';
                    case 20: return 'bg-yellow-50 text-yellow-600 border-yellow-100';
                    case 25: return 'bg-red-50 text-red-600 border-red-100';
                    case 27: return 'bg-purple-50 text-purple-600 border-purple-100';
                    default: return 'bg-blue-50 text-blue-600 border-blue-100';
                }
            }

            const getZoomStyles = () => {
                switch(zoomLevel) {
                    case 0: return { height: 'h-16', textSize: 'text-[9px]', padding: 'p-1' };
                    case 2: return { height: 'h-40', textSize: 'text-sm', padding: 'p-3' };
                    default: return { height: 'h-28 md:h-36', textSize: 'text-[11px]', padding: 'p-2' };
                }
            };
            const zoomStyles = getZoomStyles();

            return (
                <div className="glass-panel rounded-liquid p-6 overflow-hidden fade-in flex flex-col relative transition-all duration-300">
                    
                    <div className="flex flex-col md:flex-row justify-between items-center gap-6 mb-6">
                        <div className="flex items-center gap-4">
                             <div className="flex bg-white/40 rounded-xl p-1 gap-1 border border-white/60 shadow-inner">
                                <button onClick={handlePrevMonth} className="p-2 rounded-lg text-slate-500 hover:text-blue-600 hover:bg-white/50 transition-all"><Icons.ChevronLeft className="w-5 h-5"/></button>
                                <button onClick={handleToday} className="px-4 text-xs font-bold text-slate-600 hover:text-blue-600 hover:bg-white/50 rounded-lg transition-all uppercase tracking-wide">Hoje</button>
                                <button onClick={handleNextMonth} className="p-2 rounded-lg text-slate-500 hover:text-blue-600 hover:bg-white/50 transition-all"><Icons.ChevronRight className="w-5 h-5"/></button>
                            </div>
                            <h2 className="text-2xl font-bold tracking-tight text-slate-800 drop-shadow-sm">{monthNames[month]} <span className="opacity-40 font-light">{year}</span></h2>
                        </div>

                        <div className="flex items-center gap-2 bg-white/40 p-1 rounded-xl border border-white/60 shadow-inner">
                            <button 
                                onClick={() => setZoomLevel(prev => Math.max(0, prev - 1))} 
                                disabled={zoomLevel === 0}
                                className={`p-2 rounded-lg transition-all ${zoomLevel === 0 ? 'opacity-30 cursor-not-allowed' : 'text-slate-500 hover:text-blue-600 hover:bg-white/50'}`}
                            >
                                <Icons.ZoomOut className="w-4 h-4" />
                            </button>
                            <button 
                                onClick={() => setZoomLevel(prev => Math.min(2, prev + 1))} 
                                disabled={zoomLevel === 2}
                                className={`p-2 rounded-lg transition-all ${zoomLevel === 2 ? 'opacity-30 cursor-not-allowed' : 'text-slate-500 hover:text-blue-600 hover:bg-white/50'}`}
                            >
                                <Icons.ZoomIn className="w-4 h-4" />
                            </button>
                        </div>
                    </div>

                    <div className="p-1">
                        <div className="grid grid-cols-7 mb-4">
                            {["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"].map(d => (
                                <div key={d} className="text-center text-xs font-bold text-slate-400 uppercase tracking-widest">
                                    {d}
                                </div>
                            ))}
                        </div>
                        
                        <div className="grid grid-cols-7 gap-3">
                            {Array.from({ length: firstDay }).map((_, i) => (
                                <div key={`empty-${i}`}></div>
                            ))}

                            {Array.from({ length: daysInMonth }).map((_, i) => {
                                const day = i + 1;
                                const isToday = day === new Date().getDate() && month === new Date().getMonth() && year === new Date().getFullYear();
                                const hasNotification = FIXED_NOTIFICATIONS.some(n => n.day === day && (!n.months || n.months.includes(month)));

                                return (
                                    <div key={day} className={`
                                        rounded-2xl border transition-all duration-300 backdrop-blur-sm
                                        ${zoomStyles.height} ${zoomStyles.padding} flex flex-col relative group overflow-hidden
                                        ${isToday ? 'bg-white/80 border-blue-300 shadow-liquid-glow ring-2 ring-blue-100' : getDayColorStyles(day)}
                                    `}>
                                        <div className="flex justify-between items-start mb-1">
                                            <span className={`
                                                w-8 h-8 flex items-center justify-center rounded-xl text-sm font-bold transition-all
                                                ${isToday ? 'bg-gradient-to-br from-blue-500 to-cyan-500 text-white shadow-md' : 'text-slate-500 bg-white/50 shadow-sm'}
                                            `}>
                                                {day}
                                            </span>
                                            {hasNotification && (
                                                <div className="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.8)] animate-pulse"></div>
                                            )}
                                        </div>
                                        
                                        {hasNotification && (
                                            <div className="flex-1 overflow-y-auto custom-scrollbar space-y-1 mt-2">
                                                {FIXED_NOTIFICATIONS
                                                    .filter(n => n.day === day && (!n.months || n.months.includes(month)))
                                                    .map((note, idx) => (
                                                    <div key={idx} className="bg-white/50 border border-white/60 text-slate-600 text-[10px] px-2 py-1 rounded-lg font-medium truncate backdrop-blur-md">
                                                        {note.description}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="mt-8 pt-8 border-t border-slate-200/50">
                        <h3 className="font-bold text-slate-700 mb-6 flex items-center gap-3 text-lg">
                            <div className="p-2 bg-gradient-to-br from-blue-100 to-indigo-100 rounded-lg shadow-sm text-blue-600"><Icons.CheckSquare className="w-5 h-5"/></div>
                            Pagamentos Fixos de {monthNames[month]}
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {FIXED_NOTIFICATIONS
                                .filter(item => !item.months || item.months.includes(month))
                                .map((item, idx) => {
                                 const key = `${year}-${month}-${item.description}`;
                                 const isChecked = !!checkedState[key];
                                 
                                 return (
                                     <div key={idx} className={`flex items-center gap-4 p-4 rounded-2xl transition-all duration-300 border ${isChecked ? 'bg-slate-50/50 border-slate-100 opacity-60 grayscale' : 'bg-white/40 border-white/60 hover:bg-white/70 hover:shadow-md'}`}>
                                         <div className="relative flex items-center">
                                            <div 
                                                onClick={(e) => !isChecked && initiatePayment(item.description, e)}
                                                className={`w-6 h-6 rounded-lg transition-all cursor-pointer flex items-center justify-center border ${!isChecked ? 'border-slate-300 bg-white/80 hover:border-blue-400' : 'bg-green-500 border-green-500 text-white shadow-liquid-glow'}`}
                                            >
                                                {isChecked && <Icons.Check className="w-3.5 h-3.5" />}
                                            </div>
                                         </div>
                                         <label 
                                            className="flex-1 cursor-pointer select-none" 
                                            onClick={(e) => { e.preventDefault(); !isChecked && initiatePayment(item.description, e); }}
                                         >
                                             <p className={`font-semibold text-sm ${isChecked ? "text-slate-400 line-through" : "text-slate-700"}`}>
                                                 {item.description}
                                             </p>
                                             <p className={`text-xs mt-1 font-medium inline-flex items-center gap-1 px-2 py-0.5 rounded-full border ${getDueDateBadgeColor(item.day, isChecked)}`}>
                                                 <Icons.Calendar className="w-3 h-3" /> Dia {item.day}
                                             </p>
                                         </label>
                                         {isChecked && (
                                             <div className="flex flex-col items-end gap-1">
                                                 <span className="text-[10px] font-bold text-white bg-green-500/90 px-2 py-1 rounded-lg shadow-sm backdrop-blur-sm">Pago</span>
                                                 <button onClick={() => initiateFix(item.description)} className="text-[10px] font-bold text-red-400 hover:text-red-500 hover:underline">
                                                     Corrigir
                                                 </button>
                                             </div>
                                         )}
                                     </div>
                                 )
                            })}
                        </div>
                    </div>

                    {/* Modal Centralizado Corrigido */}
                    {confirmPayModal.open && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center cursor-default bg-slate-900/10 backdrop-blur-sm" onClick={() => setConfirmPayModal({open:false, desc:null})}>
                             <div 
                                onClick={e => e.stopPropagation()}
                                className="glass-panel rounded-2xl p-6 text-center animate-in fade-in zoom-in duration-200 w-72 shadow-2xl"
                            >
                                <div className="mx-auto w-12 h-12 bg-blue-50/80 rounded-full flex items-center justify-center mb-4 shadow-inner text-blue-500">
                                    <Icons.Check className="w-6 h-6" />
                                </div>
                                <h3 className="text-lg font-bold text-slate-800 mb-1">Confirmar?</h3>
                                <p className="text-xs text-slate-500 mb-6 font-medium">{confirmPayModal.desc}</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmPayModal({open:false, desc:null})} className="flex-1 py-2.5 bg-white/50 border border-white/60 text-slate-600 font-bold rounded-xl hover:bg-white/80 transition-all text-xs">Não</button>
                                    <button onClick={confirmPayment} className="flex-1 py-2.5 liquid-btn-primary rounded-xl font-bold text-xs">Sim</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {fixModal.open && (
                        <div className="fixed inset-0 z-[90] flex items-center justify-center bg-slate-900/20 backdrop-blur-md p-4 animate-in fade-in">
                            <div className="glass-panel w-full max-w-xs p-8 text-center transform transition-all scale-100 rounded-3xl">
                                <div className="mx-auto w-14 h-14 bg-red-50/80 rounded-2xl flex items-center justify-center mb-5 rotate-12 shadow-sm text-red-500">
                                    <Icons.RotateCcw className="w-7 h-7" />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">Corrigir Status</h3>
                                <p className="text-sm text-slate-500 mb-6">Digite a senha de administrador.</p>
                                <input 
                                    type="password" 
                                    autoFocus
                                    placeholder="Senha"
                                    value={fixPassword}
                                    onChange={e => setFixPassword(e.target.value)}
                                    className="liquid-input w-full px-5 py-3 rounded-xl text-center font-bold text-slate-700 mb-6 placeholder-slate-300" 
                                />
                                <div className="flex gap-3">
                                    <button onClick={() => setFixModal({open:false, desc:null})} className="flex-1 py-3 bg-white/50 border border-white/60 text-slate-600 font-bold rounded-xl hover:bg-white/80 transition-all">Cancelar</button>
                                    <button onClick={confirmFix} className="flex-1 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow-lg shadow-red-200 transition-all">Corrigir</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const CalendarIcon3D = () => {
            const today = new Date().getDate();
            return (
                <div className="relative w-10 h-10 group cursor-pointer transition-transform hover:-translate-y-0.5 active:translate-y-0">
                    <div className="absolute inset-0 bg-slate-900/20 rounded-xl translate-y-1 blur-[1px]"></div>
                    <div className="relative w-full h-full bg-[#f8f9fa] rounded-xl overflow-hidden border border-slate-200 shadow-inner flex flex-col items-center">
                        <div className="h-[35%] w-full bg-gradient-to-b from-[#ff4d4d] to-[#dc2626] relative">
                            <div className="absolute top-0 left-0 w-full h-1/2 bg-white/30 rounded-t-md"></div>
                        </div>
                        <div className="h-[65%] flex items-center justify-center">
                            <span className="text-lg font-bold text-slate-800 leading-none font-sans tracking-tight">{today}</span>
                        </div>
                    </div>
                    <div className="absolute -top-[2px] left-[20%] w-1.5 h-2.5 bg-gradient-to-b from-gray-400 via-white to-gray-500 rounded-full shadow-[0_1px_2px_rgba(0,0,0,0.3)] z-20"></div>
                    <div className="absolute -top-[2px] right-[20%] w-1.5 h-2.5 bg-gradient-to-b from-gray-400 via-white to-gray-500 rounded-full shadow-[0_1px_2px_rgba(0,0,0,0.3)] z-20"></div>
                    <div className="absolute top-[2px] left-[20%] w-1.5 h-1.5 bg-black/20 rounded-full z-10 translate-y-0.5"></div>
                    <div className="absolute top-[2px] right-[20%] w-1.5 h-1.5 bg-black/20 rounded-full z-10 translate-y-0.5"></div>
                </div>
            );
        };

        const FastForwardIcon3D = () => (
            <div className="relative w-12 h-12 group select-none">
                <div className="absolute inset-0 bg-blue-900/30 rounded-[14px] translate-y-2 translate-x-0 blur-[2px]"></div>
                <div className="absolute inset-0 bg-[#2563eb] rounded-[14px] translate-y-1.5"></div>
                <div className="absolute inset-0 bg-gradient-to-b from-[#60a5fa] to-[#3b82f6] rounded-[14px] flex items-center justify-center shadow-[inset_0_2px_4px_rgba(255,255,255,0.5),inset_0_-2px_4px_rgba(0,0,0,0.1)]">
                    <div className="flex -space-x-1.5 items-center justify-center transform translate-y-[1px]">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" className="drop-shadow-sm filter">
                            <path d="M13 17l5-5-5-5" />
                            <path d="M6 17l5-5-5-5" />
                        </svg>
                    </div>
                </div>
            </div>
        );

        const FloppyDiskIcon3D = () => (
            <div className="relative w-10 h-10 group cursor-pointer transition-transform hover:-translate-y-0.5 active:translate-y-0">
                <div className="absolute inset-0 bg-slate-900/30 rounded-lg translate-y-1 blur-[1px]"></div>
                <div className="absolute inset-0 bg-[#1e1e1e] rounded-lg shadow-[inset_0_1px_1px_rgba(255,255,255,0.15)] overflow-hidden">
                    <div className="absolute top-0 left-[10%] right-[10%] h-[40%] border-b border-l border-r border-white/5 bg-[#181818]"></div>
                    <div className="absolute top-0 left-[15%] w-[45%] h-[38%] bg-gradient-to-b from-[#e5e7eb] via-[#d1d5db] to-[#9ca3af] shadow-md flex items-center justify-center rounded-b-[2px]">
                        <div className="w-[35%] h-[65%] bg-[#1e1e1e] rounded-[1px] shadow-[inset_0_1px_2px_rgba(0,0,0,0.8)] ml-[15%]"></div>
                    </div>
                    <div className="absolute top-[60%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-[32%] h-[32%] rounded-full bg-gradient-to-br from-[#f3f4f6] to-[#6b7280] shadow-[0_1px_2px_rgba(0,0,0,0.5)] flex items-center justify-center border border-gray-400">
                        <div className="w-[30%] h-[30%] bg-[#181818] rounded-[1px] transform rotate-12 shadow-inner"></div>
                        <div className="absolute bottom-[15%] right-[25%] w-[15%] h-[15%] bg-[#181818] rounded-full shadow-inner"></div>
                    </div>
                    <div className="absolute bottom-[8%] left-[8%] w-[10%] h-[10%] bg-[#121212] rounded-[2px] shadow-[inset_0_1px_1px_rgba(255,255,255,0.05)] border border-white/5"></div>
                    <div className="absolute bottom-[8%] right-[8%] w-[10%] h-[10%] bg-[#121212] rounded-[2px] shadow-[inset_0_1px_1px_rgba(255,255,255,0.05)] border border-white/5 flex items-center justify-center">
                         <div className="w-[60%] h-[60%] bg-[#1e1e1e] mt-[40%]"></div>
                    </div>
                    <div className="absolute top-[2%] right-[2%] w-0 h-0 border-t-[6px] border-r-[6px] border-t-transparent border-r-white/5"></div>
                </div>
            </div>
        );

        const SettingsIcon3D = () => (
            <div className="relative w-12 h-12 -m-1 group cursor-pointer transition-transform hover:rotate-45 duration-700 ease-in-out">
                <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-lg filter">
                    <defs>
                        <linearGradient id="gearMetal" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#e5e7eb" /> 
                            <stop offset="50%" stopColor="#9ca3af" />
                            <stop offset="100%" stopColor="#4b5563" />
                        </linearGradient>
                        <linearGradient id="gearInner" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stopColor="#6b7280" />
                            <stop offset="100%" stopColor="#f3f4f6" />
                        </linearGradient>
                    </defs>
                    <g transform="translate(38, 38)">
                        {[0, 45, 90, 135, 180, 225, 270, 315].map(deg => (
                            <rect key={deg} x="-6" y="-38" width="12" height="76" rx="2" fill="url(#gearMetal)" transform={`rotate(${deg})`} />
                        ))}
                        <circle cx="0" cy="0" r="28" fill="url(#gearMetal)" stroke="#9ca3af" strokeWidth="1"/>
                        <circle cx="0" cy="0" r="18" fill="transparent" stroke="url(#gearInner)" strokeWidth="4" />
                        <circle cx="0" cy="0" r="12" fill="#F3F4F6" />
                    </g>
                    <g transform="translate(75, 75)">
                        {[0, 60, 120, 180, 240, 300].map(deg => (
                            <rect key={deg} x="-5" y="-24" width="10" height="48" rx="2" fill="url(#gearMetal)" transform={`rotate(${deg})`} />
                        ))}
                        <circle cx="0" cy="0" r="18" fill="url(#gearMetal)" stroke="#9ca3af" strokeWidth="1"/>
                        <circle cx="0" cy="0" r="10" fill="transparent" stroke="url(#gearInner)" strokeWidth="3" />
                        <circle cx="0" cy="0" r="6" fill="#F3F4F6" />
                    </g>
                </svg>
            </div>
        );

        const HomeIcon3D = () => (
            <div className="relative w-12 h-12 group cursor-pointer transition-transform hover:-translate-y-0.5 active:translate-y-0 -m-1">
                <div className="absolute bottom-1 left-1/2 -translate-x-1/2 w-8 h-2 bg-slate-900/20 blur-sm rounded-full"></div>
                <div className="absolute top-[18%] right-[22%] w-[12%] h-[20%] bg-gradient-to-b from-red-400 to-red-600 rounded-sm z-0 shadow-sm border border-red-700/10">
                     <div className="absolute -top-[3px] -left-[2px] w-[140%] h-[5px] bg-red-500 rounded-full shadow-sm"></div>
                </div>
                <div className="absolute bottom-[10%] left-[20%] w-[60%] h-[50%] bg-gradient-to-b from-white to-slate-100 rounded-lg shadow-[inset_0_1px_1px_rgba(255,255,255,1),0_2px_4px_rgba(0,0,0,0.05)] z-10 flex justify-center items-end border border-slate-200/50">
                    <div className="w-[40%] h-[75%] bg-gradient-to-b from-orange-400 to-orange-500 rounded-t-[6px] relative shadow-inner mb-0 border-t border-x border-white/20">
                        <div className="absolute top-[55%] left-[15%] w-1.5 h-1.5 bg-white rounded-full shadow-sm"></div>
                    </div>
                </div>
                <div className="absolute top-[8%] left-[8%] w-[84%] h-[50%] z-20 pointer-events-none drop-shadow-lg">
                     <svg viewBox="0 0 100 60" className="w-full h-full overflow-visible">
                        <path d="M10 50 L50 15 L90 50" fill="none" stroke="#b91c1c" strokeWidth="16" strokeLinecap="round" strokeLinejoin="round" />
                        <path d="M10 48 L50 13 L90 48" fill="none" stroke="#ef4444" strokeWidth="16" strokeLinecap="round" strokeLinejoin="round" />
                        <path d="M10 48 L50 13 L90 48" fill="none" stroke="#fca5a5" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" className="opacity-40 translate-y-[-2px]" />
                     </svg>
                </div>
            </div>
        );

        const WalletIcon3D = () => (
            <div className="relative w-12 h-12 group cursor-pointer transition-transform hover:-translate-y-0.5 active:translate-y-0">
                <div className="absolute bottom-0 left-1/2 -translate-x-1/2 w-10 h-3 bg-blue-900/20 blur-md rounded-full"></div>
                <div className="absolute top-1 left-2 w-8 h-6 bg-emerald-500 rounded-md transform -rotate-6 border-t border-emerald-300"></div>
                <div className="absolute top-2 left-3 w-8 h-6 bg-green-400 rounded-md transform -rotate-3 border-t border-green-200 shadow-sm"></div>
                <div className="absolute top-4 left-1 w-10 h-8 bg-gradient-to-b from-amber-700 to-amber-900 rounded-xl shadow-lg border-t border-amber-600/50">
                    <div className="absolute top-0 right-0 w-4 h-full bg-black/10 rounded-r-xl"></div>
                </div>
                <div className="absolute top-6 right-0 w-3 h-4 bg-amber-800 rounded-r-md shadow-sm flex items-center justify-center translate-x-1">
                     <div className="w-1.5 h-1.5 bg-yellow-500 rounded-full shadow-sm"></div>
                </div>
                <div className="absolute bottom-0 right-0 w-6 h-6 bg-gradient-to-br from-yellow-300 via-yellow-500 to-yellow-600 rounded-full shadow-lg border-2 border-yellow-200 flex items-center justify-center z-10">
                    <span className="text-yellow-800 font-bold text-[10px]">$</span>
                </div>
            </div>
        );

        // --- Componente Principal ---
        const App = () => {
            const [expenses, setExpenses] = useState([]);
            const [settings, setSettings] = useState(DEFAULT_SETTINGS);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [toasts, setToasts] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [groupBy, setGroupBy] = useState('date');
            const [filterDate, setFilterDate] = useState('');
            const [currentView, setCurrentView] = useState('dashboard');
            
            const [calendarChecks, setCalendarChecks] = useState({});

            const [showReminder, setShowReminder] = useState(false);
            const [pendingItems, setPendingItems] = useState([]);
            
            const fileInputRef = useRef(null);
            
            const [isPasswordModalOpen, setIsPasswordModalOpen] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [deleteModalState, setDeleteModalState] = useState({ open: false, step: 1, id: null });
            
            const [editingId, setEditingId] = useState(null);
            const [date, setDate] = useState(getTodayLocal());
            const [description, setDescription] = useState('');
            const [store, setStore] = useState('');
            const [category, setCategory] = useState('');
            const [amount, setAmount] = useState('');
            const [notes, setNotes] = useState('');

            const [showBackupOptions, setShowBackupOptions] = useState(false);
            
            // Estado para controlar delay de escrita no Firebase
            const [isRemoteUpdate, setIsRemoteUpdate] = useState(false);

            // 1. Efeito para Autenticação Anônima (Necessário para Firestore)
            useEffect(() => {
                auth.signInAnonymously().catch(error => {
                    console.error("Erro auth:", error);
                    showToast("Erro ao conectar ao servidor.", "error");
                });
                
                const savedSet = localStorage.getItem('odoo_fast_settings');
                if (savedSet) {
                    const parsed = JSON.parse(savedSet);
                    parsed.categories = CATEGORIES_LIST.map(cat => ({ label: cat, odooRef: cat }));
                    setSettings(parsed);
                }
            }, []);

            // 2. Efeito para Sincronização em Tempo Real (READ)
            useEffect(() => {
                if (settings.employeeName === "Seu Nome" || !settings.employeeName.trim()) return;

                const safeId = settings.employeeName.trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
                const docRef = db.collection('miplace-despesas').doc('data').collection('users').doc(safeId);

                const unsubscribe = docRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        setIsRemoteUpdate(true); // Bloqueia loop de escrita
                        if (data.expenses) setExpenses(data.expenses);
                        if (data.checks) setCalendarChecks(data.checks);
                        // Pequeno timeout para liberar escrita novamente
                        setTimeout(() => setIsRemoteUpdate(false), 500);
                    }
                }, (error) => {
                    console.error("Erro sync:", error);
                });

                return () => unsubscribe();
            }, [settings.employeeName]);

            // 3. Efeito para Sincronização em Tempo Real (WRITE)
            useEffect(() => {
                if (isRemoteUpdate) return; // Não salva se a mudança veio da nuvem
                if (settings.employeeName === "Seu Nome" || !settings.employeeName.trim()) {
                    // Fallback local se não tiver nome configurado
                    localStorage.setItem('odoo_fast_expenses', JSON.stringify(expenses));
                    localStorage.setItem('odoo_calendar_checks', JSON.stringify(calendarChecks));
                    return;
                }

                const timer = setTimeout(() => {
                    const safeId = settings.employeeName.trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
                    const docRef = db.collection('miplace-despesas').doc('data').collection('users').doc(safeId);
                    
                    docRef.set({
                        expenses: expenses,
                        checks: calendarChecks,
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
                        userName: settings.employeeName
                    }, { merge: true }).catch(err => console.error("Erro auto-save:", err));
                }, 1000); // Debounce de 1 segundo

                return () => clearTimeout(timer);
            }, [expenses, calendarChecks, settings.employeeName, isRemoteUpdate]);

            useEffect(() => { localStorage.setItem('odoo_fast_settings', JSON.stringify(settings)); }, [settings]);

            useEffect(() => {
                const handleBeforeUnload = (e) => {
                    const message = "Atenção: Você efetuou todos os lançamentos do dia e enviou o relatório?";
                    e.preventDefault();
                    e.returnValue = message;
                    return message;
                };

                const unlockAudio = () => {
                    initAudioContext();
                    window.removeEventListener('click', unlockAudio);
                    window.removeEventListener('keydown', unlockAudio);
                    window.removeEventListener('touchstart', unlockAudio);
                };

                window.addEventListener('beforeunload', handleBeforeUnload);
                window.addEventListener('click', unlockAudio);
                window.addEventListener('keydown', unlockAudio);
                window.addEventListener('touchstart', unlockAudio);

                return () => {
                    window.removeEventListener('beforeunload', handleBeforeUnload);
                    window.removeEventListener('click', unlockAudio);
                    window.removeEventListener('keydown', unlockAudio);
                    window.removeEventListener('touchstart', unlockAudio);
                };
            }, []);

            const playNotificationSound = () => {
                const audio = new Audio('hey_listen.mp3');
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.warn("Autoplay bloqueado.", error);
                        playSynthesizedBeep();
                    });
                }
            };

            const playSynthesizedBeep = () => {
                try {
                    const ctx = initAudioContext();
                    if (!ctx) return;
                    const playTone = (freq, startTime, duration, type = 'sine') => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.type = type;
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.3, startTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                        osc.start(startTime);
                        osc.stop(startTime + duration);
                    };
                    const now = ctx.currentTime;
                    playTone(880, now, 0.2, 'triangle');
                    playTone(587.33, now + 0.25, 0.4, 'sine');
                    playTone(880, now + 0.7, 0.2, 'triangle');
                } catch (error) {}
            };

            const checkPendingPayments = () => {
                const now = new Date();
                const currentDay = now.getDate();
                const month = now.getMonth();
                const year = now.getFullYear();

                const pending = FIXED_NOTIFICATIONS.filter(task => {
                    if (task.months && !task.months.includes(month)) return false;
                    if (task.day > currentDay) return false;
                    const key = `${year}-${month}-${task.description}`;
                    return !calendarChecks[key];
                });

                if (pending.length > 0) {
                    setPendingItems(pending);
                    setShowReminder(true);
                    playNotificationSound();
                }
            };

            useEffect(() => {
                let titleIntervalId;
                let soundIntervalId;

                if (showReminder) {
                    let isAlert = true;
                    titleIntervalId = setInterval(() => {
                        document.title = isAlert ? `(${pendingItems.length}) 🔴 PAGAR AGORA!` : "🔔 Atenção - Despesas";
                        isAlert = !isAlert;
                    }, 1000);
                    soundIntervalId = setInterval(() => {
                        playNotificationSound();
                    }, 15000);
                } else {
                    document.title = "Relatório de Despesas Miplace";
                }

                return () => {
                    clearInterval(titleIntervalId);
                    clearInterval(soundIntervalId);
                    document.title = "Relatório de Despesas Miplace";
                };
            }, [showReminder, pendingItems]);

            useEffect(() => {
                const timer = setTimeout(() => { checkPendingPayments(); }, 2000);
                const interval = setInterval(checkPendingPayments, 30 * 60 * 1000);
                return () => { clearTimeout(timer); clearInterval(interval); };
            }, [calendarChecks]);

            const showToast = (message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
            };

            const handleCalendarCheckToggle = (key, status) => {
                setCalendarChecks(prev => ({ ...prev, [key]: status }));
                // O useEffect de Sync (WRITE) cuidará de salvar no Firebase
            };

            // --- SALVAR NO COMPUTADOR ---
            const saveToComputer = async () => {
                const backupData = {
                    data: expenses,
                    checks: calendarChecks,
                    version: 2
                };

                const dataStr = JSON.stringify(backupData, null, 2);
                const fileName = `backup_completo_${formatDateBR(getTodayLocal()).replace(/\//g, '-')}.json`;

                if (window.showSaveFilePicker) {
                    try {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: fileName,
                            types: [{ description: 'Arquivo de Backup JSON', accept: { 'application/json': ['.json'] }, }],
                        });
                        const writable = await handle.createWritable();
                        await writable.write(dataStr);
                        await writable.close();
                        showToast("Backup salvo no computador!", "success");
                        setShowBackupOptions(false);
                        return;
                    } catch (err) { if (err.name === 'AbortError') return; }
                }

                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Backup baixado para Downloads!", "success");
                setShowBackupOptions(false);
            };

            // --- SALVAR NA NUVEM (LEGADO - MANTIDO PARA COMPATIBILIDADE) ---
            const saveToCloud = async () => {
                if (settings.employeeName === "Seu Nome" || !settings.employeeName.trim()) {
                    showToast("Configure seu nome nas configurações antes de salvar na nuvem!", "error");
                    return;
                }

                try {
                    await db.collection('backups').add({
                        user: settings.employeeName,
                        date: new Date(),
                        data: expenses,
                        checks: calendarChecks,
                        formattedDate: formatDateBR(getTodayLocal())
                    });
                    showToast("Backup manual salvo na nuvem!", "success");
                    setShowBackupOptions(false);
                } catch (error) {
                    console.error("Erro ao salvar no Firebase:", error);
                    showToast("Erro ao conectar com a nuvem.", "error");
                }
            };
            
            // --- RESTAURAR DA NUVEM (MANUAL) ---
            const handleCloudRestore = async () => {
                if (settings.employeeName === "Seu Nome" || !settings.employeeName.trim()) {
                    showToast("Configure seu nome para buscar seus backups!", "error");
                    return;
                }

                try {
                    const snapshot = await db.collection('backups')
                        .where('user', '==', settings.employeeName)
                        .orderBy('date', 'desc')
                        .limit(1)
                        .get();

                    if (snapshot.empty) {
                        showToast("Nenhum backup encontrado para este usuário.", "info");
                        return;
                    }

                    const doc = snapshot.docs[0].data();
                    
                    if (confirm(`Restaurar backup de ${new Date(doc.date.seconds * 1000).toLocaleString()}? Isso substituirá os dados atuais.`)) {
                        setIsRemoteUpdate(true);
                        if (doc.data && Array.isArray(doc.data)) {
                            setExpenses(doc.data);
                        }
                        if (doc.checks) {
                            setCalendarChecks(doc.checks);
                            showToast("Despesas e Checklist restaurados!", "success");
                        } else {
                            showToast("Apenas despesas restauradas.", "info");
                        }
                        setTimeout(() => setIsRemoteUpdate(false), 500);
                        setIsSettingsOpen(false);
                    }

                } catch (error) {
                    console.error("Erro ao restaurar:", error);
                    showToast("Erro ao buscar backup na nuvem.", "error");
                }
            };

            const handleBackupClick = () => {
                setShowBackupOptions(true);
            };

            const triggerRestore = () => { fileInputRef.current.click(); };

            // --- RESTAURAR ARQUIVO LOCAL ---
            const handleRestoreFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        
                        if (confirm("Isso irá substituir todas as despesas atuais pelo backup. Tem certeza?")) {
                            setIsRemoteUpdate(true);
                            // Caso 1: Backup Antigo (Array direto)
                            if (Array.isArray(importedData)) {
                                setExpenses(importedData);
                                showToast("Despesas restauradas (Formato Antigo).");
                            } 
                            // Caso 2: Backup Novo (Objeto com data e checks)
                            else if (importedData.data && Array.isArray(importedData.data)) {
                                setExpenses(importedData.data);
                                if (importedData.checks) {
                                    setCalendarChecks(importedData.checks);
                                    showToast("Despesas e Checklist restaurados!");
                                } else {
                                    showToast("Despesas restauradas!");
                                }
                            } else { 
                                showToast("Arquivo de backup inválido", "error"); 
                            }
                            setTimeout(() => setIsRemoteUpdate(false), 500);
                            setIsSettingsOpen(false);
                        }
                    } catch (err) { showToast("Erro ao ler arquivo", "error"); }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const handleAmountChange = (e) => {
                let val = e.target.value.replace(/\D/g, '');
                if (!val) { setAmount(''); return; }
                setAmount(new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(parseFloat(val) / 100));
            };

            const resetForm = () => {
                setDescription('');
                setAmount('');
                setNotes('');
                setEditingId(null);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                if (settings.employeeName === "Seu Nome" || !settings.employeeName.trim()) {
                    showToast("Por favor, configure o Nome do Funcionário nas configurações antes de lançar.", "error");
                    setIsSettingsOpen(true);
                    return;
                }
                if (!description || !amount || !category || !store) {
                    showToast("Preencha todos os campos obrigatórios", "error");
                    return;
                }
                const totalVal = parseFloat(amount.replace(/\./g, '').replace(',', '.'));
                if (isNaN(totalVal) || totalVal <= 0) {
                    showToast("Valor inválido", "error");
                    return;
                }

                if (editingId) {
                    setExpenses(prev => prev.map(ex => ex.id === editingId ? {
                        ...ex, date, description, store, category, amount: totalVal, notes
                    } : ex));
                    showToast("Lançamento atualizado com sucesso!");
                    resetForm();
                } else {
                    let entries = [];
                    if (store === "Piracicaba (DP - Realme - XV)") {
                        ["Dom Pedro II", "Realme", "Xv de Novembro"].forEach(s => entries.push({ s, v: totalVal / 3 }));
                    } else if (store === "Amparo (Premium - Kassouf)") {
                        ["Premium", "Kassouf"].forEach(s => entries.push({ s, v: totalVal / 2 }));
                    } else if (store === "Todas") {
                        ["Dom Pedro II", "Realme", "Xv de Novembro", "Premium", "Kassouf"].forEach(s => entries.push({ s, v: totalVal / 5 }));
                    } else {
                        entries.push({ s: store, v: totalVal });
                    }
                    const newItems = entries.map(ent => ({
                        id: crypto.randomUUID(),
                        date, description, category, notes,
                        store: ent.s,
                        amount: ent.v,
                        quantity: 1.0,
                        employeeName: settings.employeeName,
                        originalTotal: entries.length > 1 ? totalVal : null
                    }));
                    setExpenses(prev => [...newItems, ...prev]);
                    showToast(entries.length > 1 ? `${entries.length} despesas geradas com sucesso!` : "Despesa adicionada com sucesso!");
                    resetForm();
                }
            };

            const startEdit = (ex) => {
                setEditingId(ex.id);
                setDate(ex.date);
                setDescription(ex.description);
                setStore(ex.store);
                setCategory(ex.category);
                setAmount(formatCurrency(ex.amount));
                setNotes(ex.notes || '');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                showToast("Modo de edição ativado", "info");
                if (currentView === 'calendar') setCurrentView('dashboard');
            };

            const duplicateExpense = (ex) => {
                setDate(ex.date);
                setDescription(ex.description);
                setStore(ex.store);
                setCategory(ex.category);
                setAmount(formatCurrency(ex.amount));
                setNotes(ex.notes || '');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                showToast("Dados copiados para novo lançamento", "info");
                if (currentView === 'calendar') setCurrentView('dashboard');
            };

            const cancelEdit = () => { resetForm(); showToast("Edição cancelada", "info"); };

            const confirmDeleteExpense = (id) => { setDeleteModalState({ open: true, step: 1, id }); };

            const handleDeleteStep = () => {
                if (deleteModalState.step === 1) {
                    setDeleteModalState(prev => ({ ...prev, step: 2 }));
                } else {
                    setExpenses(prev => prev.filter(i => i.id !== deleteModalState.id));
                    setDeleteModalState({ open: false, step: 1, id: null });
                    showToast("Lançamento excluído com sucesso", "success");
                }
            };

            const closeDeleteModal = () => { setDeleteModalState({ open: false, step: 1, id: null }); };

            const confirmClearAll = () => {
                if (passwordInput === "#Banana@10") {
                    setExpenses([]);
                    setCalendarChecks({});
                    setIsPasswordModalOpen(false);
                    setPasswordInput('');
                    showToast("Todos os dados foram apagados", "success");
                } else { showToast("Senha incorreta", "error"); }
            };

            const exportToCSV = () => {
                if (expenses.length === 0) return showToast("Nada para exportar", "error");
                const headers = ["date", "name", "store_name", "product_id", "unit_amount", "quantity", "description", "employee_id"];
                const rows = expenses.map(ex => [
                    formatDateBR(ex.date), ex.description, ex.store, ex.category,
                    formatCurrency(ex.amount), ex.quantity, ex.notes, 
                    ex.employeeName || settings.employeeName
                ]);
                const csvContent = "\uFEFF" + [headers.join(';'), ...rows.map(r => r.map(f => `"${String(f).replace(/"/g, '""')}"`).join(';'))].join('\n');
                const url = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
                const link = document.createElement('a');
                link.href = url;
                link.download = `despesas_odoo_${formatDateBR(getTodayLocal()).replace(/\//g, '-')}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Arquivo CSV gerado!");
            };

            const filteredExpenses = useMemo(() => {
                let filtered = expenses;
                if (filterDate) {
                    filtered = filtered.filter(ex => ex.date === filterDate);
                }
                if (searchTerm) {
                    const lowerSearch = searchTerm.toLowerCase();
                    filtered = filtered.filter(ex => 
                        ex.description.toLowerCase().includes(lowerSearch) ||
                        ex.category.toLowerCase().includes(lowerSearch) ||
                        ex.store.toLowerCase().includes(lowerSearch) ||
                        ex.notes?.toLowerCase().includes(lowerSearch)
                    );
                }
                return filtered;
            }, [expenses, searchTerm, filterDate]);

            const groupedExpenses = useMemo(() => {
                const groups = {};
                filteredExpenses.forEach(ex => {
                    const key = groupBy === 'date' ? ex.date : ex.store;
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(ex);
                });
                const sortedKeys = Object.keys(groups).sort((a, b) => {
                    if (groupBy === 'date') return b.localeCompare(a); 
                    return a.localeCompare(b); 
                });
                return sortedKeys.map(key => ({
                    key, items: groups[key], total: groups[key].reduce((sum, item) => sum + item.amount, 0)
                }));
            }, [filteredExpenses, groupBy]);

            const totalsByStore = useMemo(() => {
                const acc = {};
                filteredExpenses.forEach(ex => { acc[ex.store] = (acc[ex.store] || 0) + ex.amount; });
                return acc;
            }, [filteredExpenses]);
            
            const totalGeneral = filteredExpenses.reduce((sum, ex) => sum + ex.amount, 0);

            return (
                <div className="pb-20 print:pb-0 min-h-screen">
                    <ToastContainer toasts={toasts} removeToast={id => setToasts(p => p.filter(t => t.id !== id))} />

                    <div className="sticky top-0 z-50 no-print px-4 py-4">
                        <div className="max-w-5xl mx-auto">
                            <div className="glass-panel p-3 px-5 flex justify-between items-center rounded-2xl">
                                <div className="flex items-center gap-4">
                                    <WalletIcon3D />
