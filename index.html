                                                <div className="space-y-2 md:col-span-2">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wide ml-1">Observações (Opcional)</label>
                                                    <input type="text" value={notes} onChange={e => setNotes(e.target.value)} className="liquid-input w-full px-5 py-3.5 rounded-xl text-slate-600 font-medium text-sm placeholder-slate-400" />
                                                </div>
                                            </div>
                                            <button type="submit" className={`w-full py-4 px-6 rounded-full font-bold text-white text-base transform transition-all active:scale-[0.98] flex items-center justify-center gap-2 mt-4 ${editingId ? 'bg-gradient-to-r from-orange-400 to-amber-500 shadow-lg rounded-2xl' : 'liquid-btn-3d'}`}>
                                                {editingId ? <Icons.Check className="w-5 h-5"/> : <Icons.Plus className="w-5 h-5"/>}
                                                {editingId ? "Salvar Alterações" : "Adicionar Despesa"}
                                            </button>
                                        </form>
                                    </div>
                                </div>

                                {/* SEÇÃO DE FILTROS E LISTA */}
                                {expenses.length > 0 && (
                                    <div className="glass-panel p-6 rounded-3xl flex flex-col gap-8 print:border-none print:shadow-none print:p-0 print:mb-6">
                                        <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                                            <div className="text-center md:text-left">
                                                <p className="text-xs text-slate-400 uppercase font-bold mb-2 no-print tracking-widest">Total Geral {getTotalTitle()}</p>
                                                <p className="text-4xl font-extrabold text-slate-800 tracking-tight drop-shadow-sm">
                                                    <span className="text-xl text-slate-400 font-bold mr-1 align-top relative top-1">{settings.currency}</span>
                                                    {formatCurrency(totalGeneral)}
                                                </p>
                                                <div className="mt-2 inline-block no-print">
                                                    <span className="text-xs font-bold text-slate-500 bg-white/60 border border-white px-3 py-1 rounded-full shadow-sm">{filteredExpenses.length} registros</span>
                                                </div>
                                            </div>
                                            <div className="flex gap-4 w-full md:w-auto no-print">
                                                <button onClick={() => window.print()} className="flex-1 md:flex-none justify-center flex items-center gap-2 px-5 py-3 bg-white/60 hover:bg-white border border-white/80 rounded-xl text-slate-600 font-bold transition-all shadow-sm">
                                                    <Icons.Printer className="w-4 h-4" /> Imprimir
                                                </button>
                                                <button onClick={exportToCSV} className="flex-1 md:flex-none justify-center flex items-center gap-2 px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl shadow-lg shadow-emerald-200/50 font-bold transition-transform hover:-translate-y-0.5">
                                                    <Icons.Download className="w-4 h-4" /> Exportar
                                                </button>
                                            </div>
                                        </div>
                                        
                                        {/* Barra de Filtros */}
                                        <div className="flex flex-col md:flex-row gap-6 no-print items-end md:items-center bg-white/30 p-4 rounded-2xl border border-white/40">
                                            <div className="relative flex-1 w-full group">
                                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><Icons.Search className="w-5 h-5 text-slate-400" /></div>
                                                <input type="text" placeholder="Pesquisar..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)}
                                                    className="w-full pl-11 pr-4 py-2.5 bg-white/60 border border-white rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm font-medium text-slate-600 placeholder-slate-400" />
                                            </div>
                                            <div className="flex flex-wrap gap-4 w-full md:w-auto items-center">
                                                {!searchTerm ? (
                                                    <>
                                                        <div className="flex bg-white/60 p-1 rounded-xl border border-white shadow-sm mr-2">
                                                            <button onClick={() => setFilterMode('day')} className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${filterMode === 'day' ? 'bg-gradient-to-r from-blue-500 to-blue-400 text-white shadow-md' : 'text-slate-500 hover:bg-white/50'}`}>Dia</button>
                                                            <button onClick={() => setFilterMode('month')} className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${filterMode === 'month' ? 'bg-gradient-to-r from-blue-500 to-blue-400 text-white shadow-md' : 'text-slate-500 hover:bg-white/50'}`}>Mês</button>
                                                        </div>
                                                        {filterMode === 'day' ? (
                                                            <div className="flex items-center gap-2 bg-white/60 p-1 rounded-xl border border-white shadow-sm">
                                                                <button onClick={handlePrevDate} disabled={availableDates.indexOf(selectedDate) <= 0} className="p-2 text-slate-500 hover:text-blue-600 hover:bg-white/50 rounded-lg disabled:opacity-30 disabled:cursor-not-allowed transition-all"><Icons.ChevronLeft className="w-5 h-5"/></button>
                                                                <span className="font-bold text-slate-700 px-2 min-w-[100px] text-center text-sm">{selectedDate ? formatDateBR(selectedDate) : '...'}</span>
                                                                <button onClick={handleNextDate} disabled={availableDates.indexOf(selectedDate) >= availableDates.length - 1} className="p-2 text-slate-500 hover:text-blue-600 hover:bg-white/50 rounded-lg disabled:opacity-30 disabled:cursor-not-allowed transition-all"><Icons.ChevronRight className="w-5 h-5"/></button>
                                                            </div>
                                                        ) : (
                                                            <div className="flex items-center gap-2 bg-white/60 p-1 rounded-xl border border-white shadow-sm">
                                                                <button onClick={handlePrevMonthFilter} disabled={availableMonths.indexOf(selectedMonth) <= 0} className="p-2 text-slate-500 hover:text-blue-600 hover:bg-white/50 rounded-lg disabled:opacity-30 disabled:cursor-not-allowed transition-all"><Icons.ChevronLeft className="w-5 h-5"/></button>
                                                                <span className="font-bold text-slate-700 px-2 min-w-[120px] text-center text-sm capitalize">{selectedMonth ? formatMonthBR(selectedMonth) : '...'}</span>
                                                                <button onClick={handleNextMonthFilter} disabled={availableMonths.indexOf(selectedMonth) >= availableMonths.length - 1} className="p-2 text-slate-500 hover:text-blue-600 hover:bg-white/50 rounded-lg disabled:opacity-30 disabled:cursor-not-allowed transition-all"><Icons.ChevronRight className="w-5 h-5"/></button>
                                                            </div>
                                                        )}
                                                    </>
                                                ) : (
                                                    <div className="bg-yellow-100 text-yellow-700 px-3 py-2 rounded-lg text-xs font-bold border border-yellow-200">Modo Busca Ativo (Global)</div>
                                                )}
                                                <div className="h-6 w-px bg-slate-300 hidden md:block"></div>
                                                <div className="flex bg-white/60 p-1 rounded-xl border border-white shadow-sm">
                                                    <button onClick={() => setGroupBy('date')} className={`px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${groupBy === 'date' ? 'bg-gradient-to-r from-blue-500 to-indigo-500 text-white shadow-md' : 'text-slate-500 hover:text-slate-800'}`}>Data</button>
                                                    <button onClick={() => setGroupBy('store')} className={`px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${groupBy === 'store' ? 'bg-gradient-to-r from-blue-500 to-indigo-500 text-white shadow-md' : 'text-slate-500 hover:text-slate-800'}`}>Loja</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* TABELAS AGRUPADAS */}
                                {expenses.length > 0 && (
                                    <div className="space-y-8 print:space-y-6">
                                        {groupedExpenses.map(group => (
                                            <div key={group.key} className="print-break-inside-avoid">
                                                <div className="flex items-center justify-between mb-4 px-2">
                                                    <h3 className="text-lg font-bold text-slate-700 flex items-center gap-3">
                                                        <div className="bg-white/80 p-2 rounded-xl shadow-sm text-blue-500 border border-white">
                                                            {groupBy === 'date' ? <Icons.Calendar className="w-5 h-5" /> : (
                                                                <img src={STORE_IMAGES[group.key] || STORE_IMAGES["default"]} alt={group.key} className="w-5 h-5 rounded-full" />
                                                            )}
                                                        </div>
                                                        {groupBy === 'date' ? formatDateBR(group.key) : group.key}
                                                    </h3>
                                                    <span className="text-sm font-bold text-slate-600 bg-white/60 px-4 py-1.5 rounded-full border border-white shadow-sm">{settings.currency} {formatCurrency(group.total)}</span>
                                                </div>

                                                <div className="glass-panel rounded-2xl overflow-hidden print:shadow-none print:border print:border-slate-300 p-0">
                                                    <div className="overflow-x-auto max-h-[500px] overflow-y-auto print-scroll-fix">
                                                        <table className="w-full text-left text-sm relative border-collapse">
                                                            <thead className="sticky top-0 z-10 bg-white/80 backdrop-blur-md border-b border-white">
                                                                <tr>
                                                                    {groupBy === 'date' && <th className="px-6 py-4 font-bold text-slate-400 uppercase text-[10px] tracking-widest">Loja</th>}
                                                                    <th className="px-6 py-4 font-bold text-slate-400 uppercase text-[10px] tracking-widest">Quem</th>
                                                                    <th className="px-6 py-4 font-bold text-slate-400 uppercase text-[10px] tracking-widest">Categoria</th>
                                                                    <th className="px-6 py-4 font-bold text-slate-400 uppercase text-[10px] tracking-widest">Data</th>
                                                                    <th className="px-6 py-4 font-bold text-slate-400 uppercase text-[10px] tracking-widest">Descrição</th>
                                                                    <th className="px-6 py-4 font-bold text-slate-400 uppercase text-[10px] tracking-widest text-right">Valor</th>
                                                                    <th className="px-6 py-4 font-bold text-slate-400 uppercase text-[10px] tracking-widest text-center no-print">Opções</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody className="divide-y divide-slate-100">
                                                                {group.items.map((ex) => (
                                                                    <tr key={ex.id} className="hover:bg-blue-50/40 transition-colors group">
                                                                        {groupBy === 'date' && (
                                                                            <td className="px-6 py-4 whitespace-nowrap">
                                                                                <span className={`inline-flex items-center px-3 py-1 rounded-lg text-[10px] font-bold shadow-sm border border-white/50 backdrop-blur-sm ${getStoreColorClass(ex.store)}`}>{ex.store}</span>
                                                                            </td>
                                                                        )}
                                                                        <td className="px-6 py-4 text-slate-600 font-medium text-xs">{ex.employeeName || settings.employeeName}</td>
                                                                        <td className="px-6 py-4 text-slate-600 text-xs font-medium"><span className="bg-white/60 border border-white px-2 py-1 rounded-md shadow-sm">{ex.category}</span></td>
                                                                        <td className="px-6 py-4 whitespace-nowrap text-slate-500 font-medium text-xs">{formatDateBR(ex.date)}</td>
                                                                        <td className="px-6 py-4">
                                                                            <div className="font-semibold text-slate-700 leading-tight">{ex.description}</div>
                                                                            {ex.notes && <div className="text-xs text-slate-400 mt-1 italic">{ex.notes}</div>}
                                                                        </td>
                                                                        <td className="px-6 py-4 text-right font-bold text-slate-700 tabular-nums">
                                                                            <div className="flex flex-col items-end">
                                                                                <span>{formatCurrency(ex.amount)}</span>
                                                                                {ex.originalTotal && (
                                                                                    <span className="text-[9px] text-slate-400 font-medium bg-white/80 px-1.5 py-0.5 rounded shadow-sm mt-1 border border-white">Orig: {formatCurrency(ex.originalTotal)}</span>
                                                                                )}
                                                                            </div>
                                                                        </td>
                                                                        <td className="px-6 py-4 text-center no-print">
                                                                            <div className="flex justify-center gap-2 opacity-0 group-hover:opacity-100 transition-all transform translate-y-1 group-hover:translate-y-0">
                                                                                <button onClick={() => duplicateExpense(ex)} className="p-1.5 text-slate-400 hover:text-blue-500 bg-white/50 hover:bg-white border border-transparent hover:border-blue-100 rounded-lg transition-all shadow-sm" title="Duplicar"><Icons.Copy className="w-4 h-4" /></button>
                                                                                <button onClick={() => startEdit(ex)} className="p-1.5 text-slate-400 hover:text-orange-500 bg-white/50 hover:bg-white border border-transparent hover:border-orange-100 rounded-lg transition-all shadow-sm" title="Editar"><Icons.Edit className="w-4 h-4" /></button>
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                {/* ESTADO VAZIO */}
                                {expenses.length === 0 && (
                                    <div className="text-center py-24 rounded-3xl border-2 border-dashed border-slate-300/60 no-print flex flex-col items-center justify-center text-slate-400 bg-white/20 backdrop-blur-sm">
                                        <div className="bg-white/60 p-6 rounded-full mb-4 shadow-liquid-glow"><Icons.FileSpreadsheet className="w-10 h-10 text-blue-300"/></div>
                                        <p className="font-bold text-slate-600 text-lg">Banco de Dados Vazio.</p>
                                        <button onClick={handleEmptyStateRestore} className="mt-6 px-8 py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-2xl shadow-lg transition-all flex items-center gap-2 animate-pulse">
                                            <Icons.CloudUpload className="w-5 h-5" /> Importar Backup do PC
                                        </button>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                                        {/* MODAL: BACKUP OPTIONS */}
                    {showBackupOptions && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/20 backdrop-blur-md p-4 animate-in fade-in zoom-in no-print">
                            <div className="glass-panel w-full max-w-sm overflow-hidden relative rounded-3xl shadow-2xl p-8 text-center">
                                <div className="mx-auto w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center mb-5 shadow-inner text-blue-500"><Icons.Save className="w-7 h-7" /></div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">Salvar Backup</h3>
                                <p className="text-sm text-slate-500 mb-8 font-medium">Onde deseja salvar seus dados?</p>
                                <div className="grid grid-cols-1 gap-3">
                                    <button onClick={saveToComputer} className="group relative w-full py-4 bg-white/60 border border-white hover:bg-white hover:border-blue-200 text-slate-700 font-bold rounded-xl shadow-sm transition-all flex items-center justify-center gap-3">
                                        <div className="p-2 bg-slate-100 rounded-lg group-hover:bg-blue-50 text-slate-500 group-hover:text-blue-500 transition-colors"><Icons.HardDrive className="w-5 h-5" /></div>
                                        <span className="flex-1 text-left">No Computador</span>
                                        <Icons.Download className="w-4 h-4 text-slate-400 mr-2" />
                                    </button>
                                    <button onClick={saveToCloud} className="group relative w-full py-4 bg-white/60 border border-white hover:bg-white hover:border-emerald-200 text-slate-700 font-bold rounded-xl shadow-sm transition-all flex items-center justify-center gap-3">
                                        <div className="p-2 bg-slate-100 rounded-lg group-hover:bg-emerald-50 text-slate-500 group-hover:text-emerald-500 transition-colors"><Icons.CloudUpload className="w-5 h-5" /></div>
                                        <span className="flex-1 text-left">Na Nuvem (Manual)</span>
                                        <span className="text-[10px] bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded-md font-bold mr-2">Online</span>
                                    </button>
                                </div>
                                <button onClick={() => setShowBackupOptions(false)} className="mt-6 text-slate-400 hover:text-slate-600 text-xs font-bold uppercase tracking-wider">Cancelar</button>
                            </div>
                        </div>
                    )}
                    
                    {/* MODAL: DELETE CONFIRMATION */}
                    {deleteModalState.open && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/20 backdrop-blur-md p-4 animate-in fade-in no-print">
                            <div className="glass-panel w-full max-w-sm rounded-3xl p-8 text-center shadow-2xl">
                                <div className="mx-auto w-14 h-14 bg-red-50 rounded-2xl flex items-center justify-center mb-5 shadow-inner text-red-500">
                                    <Icons.Trash2 className="w-7 h-7" />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">
                                    {deleteModalState.step === 1 ? "Tem certeza?" : "Confirme novamente!"}
                                </h3>
                                <p className="text-sm text-slate-500 mb-8 font-medium">
                                    {deleteModalState.step === 1 ? "Esta ação não pode ser desfeita." : "Último aviso: o registro será excluído permanentemente."}
                                </p>
                                <div className="flex gap-3">
                                    <button onClick={closeDeleteModal} className="flex-1 py-3 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-50 transition-all">Cancelar</button>
                                    <button onClick={handleDeleteStep} className="flex-1 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow-lg shadow-red-200 transition-all">
                                        {deleteModalState.step === 1 ? "Sim, Excluir" : "Confirmar Exclusão"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: SETTINGS */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/20 backdrop-blur-md no-print">
                            <div className="glass-panel w-full max-w-sm overflow-hidden flex flex-col max-h-[90vh] rounded-3xl border border-white/80 shadow-2xl">
                                <div className="p-5 border-b border-white/60 flex justify-between items-center bg-white/40">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <div className="p-1.5 bg-blue-100/50 rounded-lg text-blue-600"><Icons.Settings className="w-5 h-5"/></div>
                                        Configurações
                                    </h3>
                                    <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-slate-600 bg-white/50 p-1.5 rounded-lg transition-colors"><Icons.X className="w-5 h-5" /></button>
                                </div>
                                <div className="p-6 space-y-8 overflow-y-auto">
                                    <div className="space-y-3">
                                        <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Perfil</h4>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-2">Nome do Funcionário <span className="text-red-500">*</span></label>
                                            <input type="text" value={settings.employeeName} onChange={e => setSettings({...settings, employeeName: e.target.value})} className="liquid-input w-full p-3.5 rounded-xl font-medium text-slate-700" />
                                            <p className="text-[10px] text-slate-400 mt-2 ml-1">Este nome é a chave da sua sincronização. Use o mesmo nome em todos os dispositivos.</p>
                                        </div>
                                    </div>
                                    <div className="space-y-3 pt-4 border-t border-slate-100">
                                        <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Dados & Backup</h4>
                                        <div className="grid grid-cols-1 gap-3">
                                            <button onClick={() => { if(fileInputRef.current) fileInputRef.current.click(); }} className="flex items-center justify-center gap-2 w-full py-3.5 bg-white/60 text-slate-600 hover:text-blue-600 hover:bg-white border border-white rounded-xl transition-all shadow-sm">
                                                <Icons.Upload className="w-5 h-5" /> Restaurar Arquivo (PC)
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-5 bg-white/30 border-t border-white/60">
                                    <button onClick={() => setIsSettingsOpen(false)} className="w-full py-3.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow-lg transition-transform hover:-translate-y-0.5">Concluir</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- MOUNT ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
