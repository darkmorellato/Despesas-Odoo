        .liquid-btn-3d {
            background: linear-gradient(180deg, #3B82F6 0%, #1D4ED8 100%);
            border-radius: 9999px;
            border: none;
            box-shadow: 
                inset 0 3px 5px rgba(255,255,255,0.4),
                inset 0 -3px 5px rgba(0,0,0,0.2),
                0 8px 20px rgba(37, 99, 235, 0.4);
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .liquid-btn-3d::before {
            content: "";
            position: absolute;
            top: 3px;
            left: 5%;
            width: 90%;
            height: 40%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.05) 100%);
            border-radius: 9999px;
            pointer-events: none;
        }

        .liquid-btn-3d:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 
                inset 0 3px 5px rgba(255,255,255,0.6), 
                inset 0 -3px 5px rgba(0,0,0,0.2),
                0 12px 25px rgba(37, 99, 235, 0.5);
        }

        .liquid-btn-3d:active {
            transform: translateY(1px);
            box-shadow: 
                inset 0 2px 4px rgba(0,0,0,0.3),
                0 4px 10px rgba(37, 99, 235, 0.3);
        }

        .liquid-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);

            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15), inset 0 1px 2px rgba(0,0,0,0.03);

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

                    osc.connect(gain);

                    gain.gain.setValueAtTime(0.3, startTime);

                    case 25: return 'bg-red-50/50 border-red-200 hover:bg-red-100/50';
                    case 27: return 'bg-purple-50/50 border-purple-200 hover:bg-purple-100/50';
                    default: return 'bg-white/30 border-white/50 hover:bg-white/60';
                }
            }, []);

            const getDueDateBadgeColor = useCallback((day, isChecked) => {
                if (isChecked) return 'bg-slate-100 text-slate-400 border-slate-200';
                switch(day) {
                    case 5: return 'bg-blue-50 text-blue-600 border-blue-100';
                    case 10: return 'bg-emerald-50 text-emerald-600 border-emerald-100';
                    case 15: return 'bg-orange-50 text-orange-600 border-orange-100';
                    case 20: return 'bg-yellow-50 text-yellow-600 border-yellow-100';
                    case 25: return 'bg-red-50 text-red-600 border-red-100';
                    case 27: return 'bg-purple-50 text-purple-600 border-purple-100';
                    default: return 'bg-blue-50 text-blue-600 border-blue-100';
                }
            }, []);

            const getZoomStyles = () => {
                switch(zoomLevel) {
                    case 0: return { height: 'h-16', textSize: 'text-[9px]', padding: 'p-1' };
                    case 2: return { height: 'h-40', textSize: 'text-sm', padding: 'p-3' };
                    default: return { height: 'h-28 md:h-36', textSize: 'text-[11px]', padding: 'p-2' };
                }
            };
            const zoomStyles = getZoomStyles();

            const uniqueFixedDays = useMemo(() => {
                return [...new Set(FIXED_NOTIFICATIONS.map(n => n.day))].sort((a,b) => a - b);
            }, []);

            const getFilterButtonClass = (day, isSelected) => {
                const baseClass = "px-4 py-2 text-xs font-bold rounded-xl transition-all border shadow-sm flex items-center gap-1";
                if (!isSelected) return `${baseClass} bg-white text-slate-500 border-slate-200 hover:bg-slate-50 hover:border-slate-300`;
                switch(day) {
                    case 5: return `${baseClass} bg-blue-500 text-white border-blue-600 ring-2 ring-blue-200 shadow-blue-200`;
                    case 10: return `${baseClass} bg-emerald-500 text-white border-emerald-600 ring-2 ring-emerald-200 shadow-emerald-200`;
                    case 15: return `${baseClass} bg-orange-500 text-white border-orange-600 ring-2 ring-orange-200 shadow-orange-200`;
                    case 20: return `${baseClass} bg-yellow-500 text-white border-yellow-600 ring-2 ring-yellow-200 shadow-yellow-200`;
                    case 25: return `${baseClass} bg-red-500 text-white border-red-600 ring-2 ring-red-200 shadow-red-200`;
                    case 27: return `${baseClass} bg-purple-500 text-white border-purple-600 ring-2 ring-purple-200 shadow-purple-200`;
                    default: return `${baseClass} bg-slate-700 text-white border-slate-800`;
                }
            };

            const filteredNotifications = useMemo(() => {
                return FIXED_NOTIFICATIONS
                    .filter(item => !item.months || item.months.includes(month))
                    .filter(item => selectedDayFilter === null || item.day === selectedDayFilter);
            }, [month, selectedDayFilter]);

            return (
                <div className="glass-panel rounded-liquid p-6 overflow-hidden fade-in flex flex-col relative transition-all duration-300">
                    {/* Modal Confirmar Pagamento */}
                    {confirmPayModal.open && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
                            <div className="glass-panel w-full max-w-sm rounded-3xl p-8 text-center animate-in fade-in zoom-in duration-200 shadow-2xl">
                                <div className="mx-auto w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center mb-5 shadow-inner text-blue-500">
                                    <Icons.Check className="w-7 h-7" />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">Confirmar Pagamento?</h3>
                                <p className="text-sm text-slate-500 mb-8 font-medium">{confirmPayModal.desc}</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmPayModal({open:false, desc:null})} className="flex-1 py-3 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-50 transition-all">Não</button>
                                    <button onClick={confirmPayment} className="flex-1 py-3 liquid-btn-primary rounded-xl font-bold text-white shadow-lg">Sim, Pago</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Corrigir */}
                    {fixModal.open && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/20 backdrop-blur-md p-4 animate-in fade-in">
                            <div className="glass-panel w-full max-w-xs p-8 text-center transform transition-all scale-100 rounded-3xl">
                                <div className="mx-auto w-14 h-14 bg-red-50/80 rounded-2xl flex items-center justify-center mb-5 rotate-12 shadow-sm text-red-500">
                                    <Icons.RotateCcw className="w-7 h-7" />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">Corrigir Status</h3>
                                <p className="text-sm text-slate-500 mb-6">Digite a senha de administrador.</p>
                                <input 
                                    type="password" 
                                    autoFocus
                                    placeholder="Senha"
                                    value={fixPassword}
                                    onChange={e => setFixPassword(e.target.value)}
                                    className="liquid-input w-full px-5 py-3 rounded-xl text-center font-bold text-slate-700 mb-6 placeholder-slate-300" 
                                />
                                <div className="flex gap-3">
                                    <button onClick={() => setFixModal({open:false, desc:null})} className="flex-1 py-3 bg-white/50 border border-white/60 text-slate-600 font-bold rounded-xl hover:bg-white/80 transition-all">Cancelar</button>
                                    <button onClick={confirmFix} className="flex-1 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow-lg shadow-red-200 transition-all">Corrigir</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <div className="flex flex-col md:flex-row justify-between items-center gap-6 mb-6">
                        <div className="flex items-center gap-4">
                             <div className="flex bg-white/40 rounded-xl p-1 gap-1 border border-white/60 shadow-inner">
                                <button onClick={handlePrevMonth} className="p-2 rounded-lg text-slate-500 hover:text-blue-600 hover:bg-white/50 transition-all"><Icons.ChevronLeft className="w-5 h-5"/></button>
                                <button onClick={handleToday} className="px-4 text-xs font-bold text-slate-600 hover:text-blue-600 hover:bg-white/50 rounded-lg transition-all uppercase tracking-wide">Hoje</button>
                                <button onClick={handleNextMonth} className="p-2 rounded-lg text-slate-500 hover:text-blue-600 hover:bg-white/50 transition-all"><Icons.ChevronRight className="w-5 h-5"/></button>
                            </div>
                            <h2 className="text-2xl font-bold tracking-tight text-slate-800 drop-shadow-sm">{monthNames[month]} <span className="opacity-40 font-light">{year}</span></h2>
                        </div>
                        <div className="flex items-center gap-2 bg-white/40 p-1 rounded-xl border border-white/60 shadow-inner">
                            <button onClick={() => setZoomLevel(prev => Math.max(0, prev - 1))} disabled={zoomLevel === 0}
                                className={`p-2 rounded-lg transition-all ${zoomLevel === 0 ? 'opacity-30 cursor-not-allowed' : 'text-slate-500 hover:text-blue-600 hover:bg-white/50'}`}>
                                <Icons.ZoomOut className="w-4 h-4" />
                            </button>
                            <button onClick={() => setZoomLevel(prev => Math.min(2, prev + 1))} disabled={zoomLevel === 2}
                                className={`p-2 rounded-lg transition-all ${zoomLevel === 2 ? 'opacity-30 cursor-not-allowed' : 'text-slate-500 hover:text-blue-600 hover:bg-white/50'}`}>
                                <Icons.ZoomIn className="w-4 h-4" />
                            </button>
                        </div>
                    </div>

                    {/* Grid do Calendário */}
                    <div className="p-1">
                        <div className="grid grid-cols-7 mb-4">
                            {["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"].map(d => (
                                <div key={d} className="text-center text-xs font-bold text-slate-400 uppercase tracking-widest">{d}</div>
                            ))}
                        </div>
                        
                        <div className="grid grid-cols-7 gap-3">
                            {Array.from({ length: firstDay }).map((_, i) => <div key={`empty-${i}`}></div>)}
                            {Array.from({ length: daysInMonth }).map((_, i) => {
                                const day = i + 1;
                                const isToday = day === new Date().getDate() && month === new Date().getMonth() && year === new Date().getFullYear();
                                const hasNotification = FIXED_NOTIFICATIONS.some(n => n.day === day && (!n.months || n.months.includes(month)));
                                return (
                                    <div key={day} className={`rounded-2xl border transition-all duration-300 backdrop-blur-sm ${zoomStyles.height} ${zoomStyles.padding} flex flex-col relative group overflow-hidden ${isToday ? 'bg-white/80 border-blue-300 shadow-liquid-glow ring-2 ring-blue-100' : getDayColorStyles(day)}`}>
                                        <div className="flex justify-between items-start mb-1">
                                            <span className={`w-8 h-8 flex items-center justify-center rounded-xl text-sm font-bold transition-all ${isToday ? 'bg-gradient-to-br from-blue-500 to-cyan-500 text-white shadow-md' : 'text-slate-500 bg-white/50 shadow-sm'}`}>{day}</span>
                                            {hasNotification && <div className="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.8)] animate-pulse"></div>}
                                        </div>
                                        {hasNotification && (
                                            <div className="flex-1 overflow-y-auto custom-scrollbar space-y-1 mt-2">
                                                {FIXED_NOTIFICATIONS.filter(n => n.day === day && (!n.months || n.months.includes(month))).map((note, idx) => (
                                                    <div key={idx} className="bg-white/50 border border-white/60 text-slate-600 text-[10px] px-2 py-1 rounded-lg font-medium truncate backdrop-blur-md">{note.description}</div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Seção de Pagamentos Fixos */}
                    <div className="mt-8 pt-8 border-t border-slate-200/50">
                        <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 mb-6">
                            <h3 className="font-bold text-slate-700 flex items-center gap-3 text-lg whitespace-nowrap">
                                <div className="p-2 bg-gradient-to-br from-blue-100 to-indigo-100 rounded-lg shadow-sm text-blue-600"><Icons.CheckSquare className="w-5 h-5"/></div>
                                Pagamentos Fixos de {monthNames[month]}
                            </h3>
                            <div className="flex flex-wrap gap-2 w-full xl:w-auto justify-start xl:justify-end">
                                {uniqueFixedDays.map(day => (
                                    <button key={day} onClick={() => setSelectedDayFilter(day === selectedDayFilter ? null : day)} className={getFilterButtonClass(day, selectedDayFilter === day)}>Dia {day}</button>
                                ))}
                                <div className="w-px h-8 bg-slate-300 mx-1 hidden sm:block"></div>
                                <button onClick={() => setSelectedDayFilter(null)} className={`px-4 py-2 text-xs font-bold rounded-xl transition-all border shadow-sm ${selectedDayFilter === null ? 'bg-slate-700 text-white border-slate-800 ring-2 ring-slate-200' : 'bg-white text-slate-400 border-slate-200 hover:bg-slate-50'}`}>Todos</button>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            {filteredNotifications.map((item, idx) => {
                                const key = `${year}-${month}-${item.description}`;
                                const isChecked = !!checkedState[key];
                                return (
                                    <div key={idx} className={`flex items-center gap-4 p-4 rounded-2xl transition-all duration-300 border ${isChecked ? 'bg-slate-50/50 border-slate-100 opacity-60 grayscale' : 'bg-white/40 border-white/60 hover:bg-white/70 hover:shadow-md'}`}>
                                        <div className="relative flex items-center">
                                            <div onClick={() => !isChecked && initiatePayment(item.description)}
                                                className={`w-6 h-6 rounded-lg transition-all cursor-pointer flex items-center justify-center border ${!isChecked ? 'border-slate-300 bg-white/80 hover:border-blue-400' : 'bg-green-500 border-green-500 text-white shadow-liquid-glow'}`}>
                                                {isChecked && <Icons.Check className="w-3.5 h-3.5" />}
                                            </div>
                                        </div>
                                        <label className="flex-1 cursor-pointer select-none" onClick={(e) => { e.preventDefault(); !isChecked && initiatePayment(item.description); }}>
                                            <p className={`font-semibold text-sm ${isChecked ? "text-slate-400 line-through" : "text-slate-700"}`}>{item.description}</p>
                                            <p className={`text-xs mt-1 font-medium inline-flex items-center gap-1 px-2 py-0.5 rounded-full border ${getDueDateBadgeColor(item.day, isChecked)}`}>
                                                <Icons.Calendar className="w-3 h-3" /> Dia {item.day}
                                            </p>
                                        </label>
                                        {isChecked && (
                                            <div className="flex flex-col items-end gap-1">
                                                <span className="text-[10px] font-bold text-white bg-green-500/90 px-2 py-1 rounded-lg shadow-sm backdrop-blur-sm">Pago</span>
                                                <button onClick={() => initiateFix(item.description)} className="text-[10px] font-bold text-red-400 hover:text-red-500 hover:underline">Corrigir</button>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        });
                // --- DASHBOARD ANALÍTICO ---
        const AnalyticsDashboard = memo(({ expenses, currency, formatCurrency }) => {
            const [viewMode, setViewMode] = useState('month');
            const [currentDate, setCurrentDate] = useState(new Date());

            const handlePrev = useCallback(() => {
                setCurrentDate(prev => {
                    const newDate = new Date(prev);
                    if (viewMode === 'month') newDate.setMonth(newDate.getMonth() - 1);
                    else newDate.setFullYear(newDate.getFullYear() - 1);
                    return newDate;
                });
            }, [viewMode]);

            const handleNext = useCallback(() => {
                setCurrentDate(prev => {
                    const newDate = new Date(prev);
                    if (viewMode === 'month') newDate.setMonth(newDate.getMonth() + 1);
                    else newDate.setFullYear(newDate.getFullYear() + 1);
                    return newDate;
                });
            }, [viewMode]);

            const getLabel = () => {
                if (viewMode === 'month') {
                    const monthName = currentDate.toLocaleDateString('pt-BR', { month: 'long' });
                    return `${monthName.charAt(0).toUpperCase() + monthName.slice(1)} ${currentDate.getFullYear()}`;
                }
                return `Ano de ${currentDate.getFullYear()}`;
            };

            const filteredData = useMemo(() => {
                const targetYear = currentDate.getFullYear();
                const targetMonth = currentDate.getMonth();
                return expenses.filter(ex => {
                    const [y, m] = ex.date.split('-').map(Number);
                    if (viewMode === 'year') return y === targetYear;
                    return y === targetYear && (m - 1) === targetMonth;
                });
            }, [expenses, currentDate, viewMode]);

            const monthlyData = useMemo(() => {
                if (viewMode !== 'year') return [];
                const months = Array(12).fill(0);
                filteredData.forEach(ex => {
                    const monthIndex = parseInt(ex.date.split('-')[1]) - 1;
                    months[monthIndex] += ex.amount;
                });
                return months;
            }, [filteredData, viewMode]);

            const total = useMemo(() => filteredData.reduce((acc, curr) => acc + curr.amount, 0), [filteredData]);
            
            const sortedStores = useMemo(() => {
                const acc = {};
                filteredData.forEach(ex => { acc[ex.store] = (acc[ex.store] || 0) + ex.amount; });
                return Object.entries(acc).sort((a, b) => b[1] - a[1]);
            }, [filteredData]);

            const sortedCategories = useMemo(() => {
                const acc = {};
                filteredData.forEach(ex => { acc[ex.category] = (acc[ex.category] || 0) + ex.amount; });
                return Object.entries(acc).sort((a, b) => b[1] - a[1]);
            }, [filteredData]);

            const topExpenses = useMemo(() => {
                return [...filteredData].sort((a, b) => b.amount - a.amount).slice(0, 5);
            }, [filteredData]);

            const getBarWidth = (value, max) => max > 0 ? `${(value / max) * 100}%` : '0%';
            const getBarHeight = (value, max) => max > 0 ? `${(value / max) * 100}%` : '0%';

            return (
                <div className="space-y-6 fade-in">
                    {/* Header de Controle */}
                    <div className="glass-panel p-2 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex bg-slate-200/50 p-1 rounded-xl">
                            <button onClick={() => setViewMode('month')} className={`px-6 py-2 rounded-lg text-sm font-bold transition-all ${viewMode === 'month' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Mensal</button>
                            <button onClick={() => setViewMode('year')} className={`px-6 py-2 rounded-lg text-sm font-bold transition-all ${viewMode === 'year' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Anual</button>
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={handlePrev} className="p-2 hover:bg-white/50 rounded-lg text-slate-500 transition-colors"><Icons.ChevronLeft className="w-5 h-5"/></button>
                            <h3 className="text-lg font-black text-slate-700 min-w-[150px] text-center capitalize">{getLabel()}</h3>
                            <button onClick={handleNext} className="p-2 hover:bg-white/50 rounded-lg text-slate-500 transition-colors"><Icons.ChevronRight className="w-5 h-5"/></button>
                        </div>
                    </div>

                    {filteredData.length === 0 ? (
                        <div className="glass-panel p-12 rounded-3xl text-center text-slate-400 border border-dashed border-slate-300">
                            <div className="flex justify-center mb-4 opacity-50"><ChartIcon3D /></div>
                            <h3 className="text-xl font-bold text-slate-600">Sem dados neste período</h3>
                            <p className="text-sm mt-1">Nenhum lançamento encontrado para {getLabel()}.</p>
                        </div>
                    ) : (
                        <>
                            {/* Cards de Resumo */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="glass-panel p-5 rounded-2xl border-l-4 border-l-blue-500 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-4 opacity-10 transform translate-x-2 -translate-y-2"><Icons.DollarSign className="w-16 h-16" /></div>
                                    <p className="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Total {viewMode === 'year' ? 'Anual' : 'Mensal'}</p>
                                    <h3 className="text-2xl font-black text-slate-800">{currency} {formatCurrency(total)}</h3>
                                    {viewMode === 'year' && (
                                        <p className="text-[10px] text-blue-500 font-bold mt-2 bg-blue-50 inline-block px-2 py-0.5 rounded">Média: {currency} {formatCurrency(total / 12)} / mês</p>
                                    )}
                                </div>
                                <div className="glass-panel p-5 rounded-2xl border-l-4 border-l-orange-500 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-4 opacity-10 transform translate-x-2 -translate-y-2"><Icons.Store className="w-16 h-16" /></div>
                                    <p className="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Loja Top 1</p>
                                    <h3 className="text-xl font-black text-slate-800 truncate" title={sortedStores[0]?.[0]}>{sortedStores[0]?.[0] || '-'}</h3>
                                    <p className="text-sm font-bold text-orange-500 mt-1">{currency} {formatCurrency(sortedStores[0]?.[1] || 0)}</p>
                                </div>
                                <div className="glass-panel p-5 rounded-2xl border-l-4 border-l-emerald-500 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-4 opacity-10 transform translate-x-2 -translate-y-2"><Icons.Tag className="w-16 h-16" /></div>
                                    <p className="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Categoria Top 1</p>
                                    <h3 className="text-xl font-black text-slate-800 truncate" title={sortedCategories[0]?.[0]}>{sortedCategories[0]?.[0] || '-'}</h3>
                                    <p className="text-sm font-bold text-emerald-500 mt-1">{currency} {formatCurrency(sortedCategories[0]?.[1] || 0)}</p>
                                </div>
                            </div>

                            {/* Gráfico Anual */}
                            {viewMode === 'year' && (
                                <div className="glass-panel p-6 rounded-3xl">
                                    <h3 className="font-bold text-slate-700 mb-6 flex items-center gap-2">
                                        <span className="bg-indigo-100 text-indigo-600 p-1.5 rounded-lg"><Icons.FileSpreadsheet className="w-4 h-4"/></span>
                                        Evolução Mensal ({currentDate.getFullYear()})
                                    </h3>
                                    <div className="h-48 flex items-end justify-between gap-2">
                                        {monthlyData.map((val, idx) => {
                                            const maxVal = Math.max(...monthlyData);
                                            const monthName = new Date(2024, idx, 1).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
                                            return (
                                                <div key={idx} className="flex-1 flex flex-col items-center gap-2 group h-full justify-end">
                                                    {val > 0 && (
                                                        <span className="text-[9px] font-bold text-slate-500 opacity-0 group-hover:opacity-100 transition-opacity -mb-1 bg-white px-1 rounded shadow-sm z-10 whitespace-nowrap">{formatCurrency(val)}</span>
                                                    )}
                                                    <div className={`w-full max-w-[30px] rounded-t-lg transition-all duration-700 relative ${val > 0 ? 'bg-indigo-400 group-hover:bg-indigo-500' : 'bg-slate-100 h-1'}`}
                                                        style={{ height: val > 0 ? getBarHeight(val, maxVal) : '4px' }}>
                                                        {val > 0 && <div className="absolute top-0 left-0 w-full h-1 bg-white/30 rounded-t-lg"></div>}
                                                    </div>
                                                    <span className="text-[10px] font-bold text-slate-400 uppercase">{monthName}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {/* Ranking e Top Despesas */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <div className="glass-panel p-6 rounded-3xl">
                                    <h3 className="font-bold text-slate-700 mb-6 flex items-center gap-2">
                                        <span className="bg-blue-100 text-blue-600 p-1.5 rounded-lg"><Icons.Store className="w-4 h-4"/></span>
                                        Ranking de Lojas ({viewMode === 'month' ? 'Mês' : 'Ano'})
                                    </h3>
                                    <div className="space-y-4">
                                        {sortedStores.map(([store, value]) => (
                                            <div key={store} className="relative">
                                                <div className="flex justify-between text-xs font-bold text-slate-600 mb-1">
                                                    <span>{store}</span>
                                                    <span>{currency} {formatCurrency(value)}</span>
                                                </div>
                                                <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden shadow-inner">
                                                    <div className={`h-full rounded-full bg-gradient-to-r ${getStoreBarColor(store)} transition-all duration-1000 ease-out`}
                                                        style={{ width: getBarWidth(value, sortedStores[0][1]) }}></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-panel p-6 rounded-3xl">
                                    <h3 className="font-bold text-slate-700 mb-6 flex items-center gap-2">
                                        <span className="bg-red-100 text-red-600 p-1.5 rounded-lg"><Icons.AlertTriangle className="w-4 h-4"/></span>
                                        Maiores Despesas ({viewMode === 'month' ? 'Mês' : 'Ano'})
                                    </h3>
                                    <div className="overflow-hidden rounded-xl border border-slate-200/60">
                                        <table className="w-full text-left text-xs">
                                            <thead className="bg-slate-50/50 text-slate-500 font-bold uppercase">
                                                <tr>
                                                    <th className="p-3">Descrição</th>
                                                    <th className="p-3">Loja</th>
                                                    <th className="p-3 text-right">Valor</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 bg-white/40">
                                                {topExpenses.map((ex, idx) => (
                                                    <tr key={ex.id || idx} className="hover:bg-white/60 transition-colors">
                                                        <td className="p-3 font-medium text-slate-700 truncate max-w-[120px]">{ex.description}</td>
                                                        <td className="p-3 text-slate-500 truncate max-w-[80px]">{ex.store}</td>
                                                        <td className="p-3 text-right font-bold text-slate-700">{formatCurrency(ex.amount)}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            {/* Distribuição por Categoria */}
                            <div className="glass-panel p-6 rounded-3xl">
                                <h3 className="font-bold text-slate-700 mb-6 flex items-center gap-2">
                                    <span className="bg-purple-100 text-purple-600 p-1.5 rounded-lg"><Icons.Tag className="w-4 h-4"/></span>
                                    Distribuição por Categoria
                                </h3>
                                <div className="flex flex-wrap gap-3">
                                    {sortedCategories.map(([cat, val]) => (
                                        <div key={cat} className="flex-1 min-w-[140px] bg-white/60 border border-white p-3 rounded-xl shadow-sm flex flex-col justify-between hover:bg-white/80 transition-colors">
                                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">{cat}</span>
                                            <div className="flex items-end justify-between">
                                                <span className="font-bold text-slate-700 text-sm">{currency} {formatCurrency(val)}</span>
                                                <div className="text-[10px] font-bold text-blue-500 bg-blue-50 px-1.5 rounded">{total > 0 ? Math.round((val / total) * 100) : 0}%</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </>
                    )}
                </div>
            );
        });
                // --- COMPONENTE PRINCIPAL (App) ---
        const App = () => {
            // --- Estados ---
            const [expenses, setExpenses] = useState([]);
            const [settings, setSettings] = useState(DEFAULT_SETTINGS);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [toasts, setToasts] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [groupBy, setGroupBy] = useState('date');
            const [filterMode, setFilterMode] = useState('day');
            const [selectedDate, setSelectedDate] = useState('');
            const [selectedMonth, setSelectedMonth] = useState('');
            const [currentView, setCurrentView] = useState('dashboard');
            const [syncStatus, setSyncStatus] = useState('offline');
            const [user, setUser] = useState(null);
            const [calendarChecks, setCalendarChecks] = useState({});
            const [showReminder, setShowReminder] = useState(false);
            const [pendingItems, setPendingItems] = useState([]);
            const [showBackupOptions, setShowBackupOptions] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [date, setDate] = useState(getTodayLocal());
            const [description, setDescription] = useState('');
            const [store, setStore] = useState('');
            const [category, setCategory] = useState('');
            const [amount, setAmount] = useState('');
            const [notes, setNotes] = useState('');
            const [deleteModalState, setDeleteModalState] = useState({ open: false, step: 1, id: null });
            const [isPasswordModalOpen, setIsPasswordModalOpen] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            
            // --- Refs ---
            const fileInputRef = useRef(null);
            const checksLoaded = useRef(false);

            // --- Firebase Refs (estáveis com useMemo) ---
            const firebaseRefs = useMemo(() => {
                let expensesRef, checksRef;
                
                if (typeof __app_id !== 'undefined') {
                    const base = db.collection('artifacts').doc(envAppId).collection('public').doc('data');
                    expensesRef = base.collection('expenses'); 
                    checksRef = base.collection('team_data').doc(CHECKLIST_DOC_ID);
                } else {
                    expensesRef = db.collection('miplace-despesas').doc('data').collection('team_expenses_v2'); 
                    checksRef = db.collection('miplace-despesas')
                                  .doc('data-team_data')
                                  .collection('global_checklist_v1')
                                  .doc('checks');
                }
                return { expensesRef, checksRef };
            }, []);

            // --- Toast Helper (estável com useCallback) ---
            const showToast = useCallback((message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
            }, []);

            // --- 1. Auth Init ---
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (error) {
                        console.error("Erro auth:", error);
                        setSyncStatus('error');
                        showToast("Erro ao conectar ao servidor.", "error");
                    }
                };
                
                const unsubAuth = auth.onAuthStateChanged(u => {
                    if (u) setUser(u);
                });

                initAuth();

                const savedSet = localStorage.getItem('odoo_fast_settings');
                if (savedSet) {
                    try {
                        const parsed = JSON.parse(savedSet);
                        parsed.categories = CATEGORIES_LIST.map(cat => ({ label: cat, odooRef: cat }));
                        setSettings(parsed);
                    } catch (e) {
                        console.warn("Erro ao parsear settings:", e);
                    }
                }

                return () => unsubAuth();
            }, [showToast]);

            // --- 2. Read Expenses (Coleção) ---
            useEffect(() => {
                if (!user) return;
                setSyncStatus('syncing');
                
                const unsubscribe = firebaseRefs.expensesRef.orderBy('date', 'desc').onSnapshot(
                    snapshot => {
                        const loadedExpenses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setExpenses(loadedExpenses);
                        setSyncStatus('synced');
                    }, 
                    err => {
                        console.error("Erro leitura despesas:", err);
                        setSyncStatus('error');
                    }
                );

                return () => unsubscribe();
            }, [user, firebaseRefs.expensesRef]);

            // --- 3. Read Checklist ---
            useEffect(() => {
                if (!user) return;
                checksLoaded.current = false;

                const unsubscribe = firebaseRefs.checksRef.onSnapshot(
                    doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            setCalendarChecks(data.checks || {});
                        }
                        checksLoaded.current = true;
                    }, 
                    err => {
                        console.error("Erro ao ler checklist:", err);
                        checksLoaded.current = true;
                    }
                );

                return () => unsubscribe();
            }, [user, firebaseRefs.checksRef]);

            // --- 4. Write Checklist (debounced, só após load) ---
            useEffect(() => {
                if (!user) return;
                if (!checksLoaded.current) return;

                const timer = setTimeout(() => {
                    firebaseRefs.checksRef.set({ checks: calendarChecks }, { merge: true })
                        .then(() => console.log("✅ Checklist salvo no Firebase"))
                        .catch(err => console.error("❌ Erro ao salvar checklist:", err));
                }, 800);
                
                return () => clearTimeout(timer);
            }, [calendarChecks, user, firebaseRefs.checksRef]);

            // --- 5. Salvar Settings local ---
            useEffect(() => {
                localStorage.setItem('odoo_fast_settings', JSON.stringify(settings));
            }, [settings]);

            // --- 6. Event Listeners (beforeunload + audio unlock) ---
            useEffect(() => {
                const handleBeforeUnload = (e) => {
                    const message = "Atenção: Você efetuou todos os lançamentos do dia e enviou o relatório?";
                    e.preventDefault();
                    e.returnValue = message;
                    return message;
                };
                
                const unlockAudio = () => {
                    initAudioContext();
                    window.removeEventListener('click', unlockAudio);
                    window.removeEventListener('keydown', unlockAudio);
                    window.removeEventListener('touchstart', unlockAudio);
                };
                
                window.addEventListener('beforeunload', handleBeforeUnload);
                window.addEventListener('click', unlockAudio);
                window.addEventListener('keydown', unlockAudio);
                window.addEventListener('touchstart', unlockAudio);
                
                return () => {
                    window.removeEventListener('beforeunload', handleBeforeUnload);
                    window.removeEventListener('click', unlockAudio);
                    window.removeEventListener('keydown', unlockAudio);
                    window.removeEventListener('touchstart', unlockAudio);
                };
            }, []);

            // --- 7. Verificação de Pagamentos Pendentes ---
            const checkPendingPayments = useCallback(() => {
                const now = new Date();
                const currentDay = now.getDate();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();

                const pending = FIXED_NOTIFICATIONS.filter(task => {
                    if (task.months && !task.months.includes(currentMonth)) return false;
                    if (task.day > currentDay) return false;
                    const key = `${currentYear}-${currentMonth}-${task.description}`;
                    return !calendarChecks[key];
                });

                if (pending.length > 0) {
                    setPendingItems(pending);
                    setShowReminder(true);
                    playNotificationSound();
                } else {
                    setShowReminder(false);
                    setPendingItems([]);
                }
            }, [calendarChecks]);

            // --- 8. Timer de verificação + som ---
            useEffect(() => {
                const timer = setTimeout(() => checkPendingPayments(), 2000);
                const interval = setInterval(checkPendingPayments, 30 * 60 * 1000);
                return () => { clearTimeout(timer); clearInterval(interval); };
            }, [checkPendingPayments]);

            // --- 9. Título piscante quando há pendências ---
            useEffect(() => {
                let titleIntervalId;
                let soundIntervalId;

                if (showReminder && pendingItems.length > 0) {
                    let isAlert = true;
                    titleIntervalId = setInterval(() => {
                        document.title = isAlert ? `(${pendingItems.length}) 🔴 PAGAR AGORA!` : "🔔 Atenção - Despesas";
                        isAlert = !isAlert;
                    }, 1000);
                    soundIntervalId = setInterval(() => playNotificationSound(), 15000);
                } else {
                    document.title = "Relatório de Despesas Miplace";
                }

                return () => {
                    clearInterval(titleIntervalId);
                    clearInterval(soundIntervalId);
                    document.title = "Relatório de Despesas Miplace";
                };
            }, [showReminder, pendingItems.length]);

            // --- DB Handlers ---
            const handleDBAdd = useCallback(async (newExpense) => {
                try {
                    await firebaseRefs.expensesRef.add(newExpense); 
                    setSyncStatus('synced');
                } catch (e) {
                    console.error("Erro ao adicionar:", e);
                    showToast("Erro ao salvar online", "error");
                }
            }, [firebaseRefs.expensesRef, showToast]);

            const handleDBUpdate = useCallback(async (id, updatedData) => {
                try {
                    await firebaseRefs.expensesRef.doc(id).update(updatedData);
                    setSyncStatus('synced');
                } catch (e) { 
                    console.error("Erro update:", e); 
                    showToast("Erro ao atualizar", "error");
                }
            }, [firebaseRefs.expensesRef, showToast]);

            const handleDBDelete = useCallback(async (id) => {
                try {
                    await firebaseRefs.expensesRef.doc(id).delete();
                    setSyncStatus('synced');
                } catch (e) { 
                    console.error("Erro delete:", e); 
                    showToast("Erro ao excluir", "error");
                }
            }, [firebaseRefs.expensesRef, showToast]);

            // --- Form Handlers ---
            const resetForm = useCallback(() => {
                setDescription('');
                setAmount('');
                setNotes('');
                setEditingId(null);
            }, []);

            const handleAmountChange = useCallback((e) => {
                let val = e.target.value.replace(/\D/g, '');
                if (!val) { setAmount(''); return; }
                setAmount(new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(parseFloat(val) / 100));
            }, []);

            const handleSubmit = useCallback(async (e) => {
                e.preventDefault();
                if (settings.employeeName === "Seu Nome" || !settings.employeeName.trim()) {
                    showToast("Configure seu nome antes de lançar.", "error");
                    setIsSettingsOpen(true);
                    return;
                }
                const totalVal = parseFloat(amount.replace(/\./g, '').replace(',', '.'));
                if (isNaN(totalVal) || totalVal <= 0) return showToast("Valor inválido", "error");

                if (editingId) {
                    const updatedData = {
                        date, description, store, category, amount: totalVal, notes,
                        employeeName: settings.employeeName,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    await handleDBUpdate(editingId, updatedData);
                    showToast("Lançamento atualizado!");
                    resetForm();
                } else {
                    let entries = [];
                    if (store === "Piracicaba (DP - Realme - XV)") {
                        ["Dom Pedro II", "Realme", "Xv de Novembro"].forEach(s => entries.push({ s, v: totalVal / 3 }));
                    } else if (store === "Amparo (Premium - Kassouf)") {
                        ["Premium", "Kassouf"].forEach(s => entries.push({ s, v: totalVal / 2 }));
                    } else if (store === "Todas") {
                        ["Dom Pedro II", "Realme", "Xv de Novembro", "Premium", "Kassouf"].forEach(s => entries.push({ s, v: totalVal / 5 }));
                    } else {
                        entries.push({ s: store, v: totalVal });
                    }

                    for (let ent of entries) {
                        const newDoc = {
                            date, description, category, notes,
                            store: ent.s,
                            amount: ent.v,
                            quantity: 1.0,
                            employeeName: settings.employeeName,
                            originalTotal: entries.length > 1 ? totalVal : null,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        };
                        await handleDBAdd(newDoc);
                    }
                    showToast(entries.length > 1 ? `${entries.length} despesas geradas!` : "Despesa salva!");
                    resetForm();
                }
            }, [settings.employeeName, amount, date, description, store, category, notes, editingId, handleDBUpdate, handleDBAdd, resetForm, showToast]);

            const handleDeleteStep = useCallback(async () => {
                if (deleteModalState.step === 1) {
                    setDeleteModalState(prev => ({ ...prev, step: 2 }));
                } else {
                    await handleDBDelete(deleteModalState.id);
                    setDeleteModalState({ open: false, step: 1, id: null });
                    showToast("Excluído com sucesso", "success");
                }
            }, [deleteModalState.step, deleteModalState.id, handleDBDelete, showToast]);

            const handleCalendarCheckToggle = useCallback((key, status) => {
                setCalendarChecks(prev => ({ ...prev, [key]: status }));
            }, []);

            const startEdit = useCallback((ex) => {
                setEditingId(ex.id);
                setDate(ex.date);
                setDescription(ex.description);
                setStore(ex.store);
                setCategory(ex.category);
                setAmount(formatCurrency(ex.amount));
                setNotes(ex.notes || '');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                showToast("Editando...", "info");
                if (currentView === 'calendar') setCurrentView('dashboard');
            }, [showToast, currentView]);

            const duplicateExpense = useCallback((ex) => {
                setDate(ex.date);
                setDescription(ex.description);
                setStore(ex.store);
                setCategory(ex.category);
                setAmount(formatCurrency(ex.amount));
                setNotes(ex.notes || '');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                showToast("Copiado!", "info");
                if (currentView === 'calendar') setCurrentView('dashboard');
            }, [showToast, currentView]);

            const cancelEdit = useCallback(() => { resetForm(); showToast("Cancelado", "info"); }, [resetForm, showToast]);
            const confirmDeleteExpense = useCallback((id) => { setDeleteModalState({ open: true, step: 1, id }); }, []);
            const closeDeleteModal = useCallback(() => { setDeleteModalState({ open: false, step: 1, id: null }); }, []);

            const confirmClearAll = useCallback(async () => {
                if (passwordInput === "#Banana@10") {
                    // NOTA: Isso limpa apenas o estado local. O Firebase mantém os dados.
                    // Para limpar de verdade, implemente uma Cloud Function.
                    setExpenses([]);
                    setCalendarChecks({});
                    setIsPasswordModalOpen(false);
                    setPasswordInput('');
                    showToast("Limpeza visual realizada (dados na nuvem mantidos)", "warning");
                } else { 
                    showToast("Senha incorreta", "error"); 
                }
            }, [passwordInput, showToast]);

            // --- Backup / Restore ---
            const saveToComputer = useCallback(async () => {
                const backupData = { data: expenses, checks: calendarChecks, version: 3 };
                const dataStr = JSON.stringify(backupData, null, 2);
                const fileName = `backup_completo_${formatDateBR(getTodayLocal()).replace(/\//g, '-')}.json`;

                if (window.showSaveFilePicker) {
                    try {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: fileName,
                            types: [{ description: 'Arquivo de Backup JSON', accept: { 'application/json': ['.json'] } }],
                        });
                        const writable = await handle.createWritable();
                        await writable.write(dataStr);
                        await writable.close();
                        showToast("Backup salvo no computador!", "success");
                        setShowBackupOptions(false);
                        return;
                    } catch (err) { 
                        if (err.name === 'AbortError') return; 
                    }
                }

                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast("Backup baixado para Downloads!", "success");
                setShowBackupOptions(false);
            }, [expenses, calendarChecks, showToast]);

            const saveToCloud = useCallback(async () => {
                showToast("Os dados já estão salvos automaticamente!", "info");
            }, [showToast]);

            const handleRestoreFile = useCallback((e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        
                        if (!confirm("ATENÇÃO: Deseja enviar estes dados para a nuvem para que TODOS tenham acesso?")) return;
                        
                        let batch = db.batch();
                        let count = 0;
                        let totalCommitted = 0;
                        
                        const dataArray = importedData.data;
                        if (!Array.isArray(dataArray) || dataArray.length === 0) {
                            return showToast("Arquivo sem dados válidos", "error");
                        }

                        for (const item of dataArray) {
                            if (!item.date || !item.description || !item.store) {
                                console.warn("Item inválido ignorado:", item);
                                continue;
                            }
                            
                            const { id, ...cleanItem } = item;
                            const ref = firebaseRefs.expensesRef.doc();
                            batch.set(ref, {
                                ...cleanItem,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                            count++;
                            
                            if (count % 400 === 0) {
                                try {
                                    await batch.commit();
                                    totalCommitted += count;
                                    count = 0;
                                    batch = db.batch();
                                } catch (batchErr) {
                                    console.error("Erro no batch:", batchErr);
                                    showToast(`Erro parcial: ${totalCommitted} salvos de ${dataArray.length}`, "error");
                                    return;
                                }
                            }
                        }
                        
                        if (count > 0) {
                            await batch.commit();
                            totalCommitted += count;
                        }

                        // Restaurar checks
                        if (importedData.checks && Object.keys(importedData.checks).length > 0) {
                            await firebaseRefs.checksRef.set({ checks: importedData.checks }, { merge: true });
                        }

                        showToast(`${totalCommitted} registros importados com sucesso!`, "success");
                    } catch (err) { 
                        console.error("Erro ao restaurar:", err);
                        showToast("Erro ao ler arquivo: " + err.message, "error"); 
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            }, [firebaseRefs, showToast]);

            const exportToCSV = useCallback(() => {
                if (expenses.length === 0) return showToast("Nada para exportar", "error");
                const headers = ["date", "name", "store_name", "product_id", "unit_amount", "quantity", "description", "employee_id"];
                const rows = expenses.map(ex => [
                    formatDateBR(ex.date), ex.description, ex.store, ex.category,
                    formatCurrency(ex.amount), ex.quantity, ex.notes, 
                    ex.employeeName || settings.employeeName
                ]);
                const csvContent = "\uFEFF" + [headers.join(';'), ...rows.map(r => r.map(f => `"${String(f || '').replace(/"/g, '""')}"`).join(';'))].join('\n');
                const url = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
                const link = document.createElement('a');
                link.href = url;
                link.download = `despesas_odoo_${formatDateBR(getTodayLocal()).replace(/\//g, '-')}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast("Arquivo CSV gerado!");
            }, [expenses, settings.employeeName, showToast]);

            const handleEmptyStateRestore = useCallback(() => {
                if (fileInputRef.current) fileInputRef.current.click();
            }, []);
                        // --- Dados Computados (useMemo) ---
            const availableDates = useMemo(() => {
                const dates = [...new Set(expenses.map(e => e.date))];
                return dates.sort((a, b) => a.localeCompare(b));
            }, [expenses]);

            const availableMonths = useMemo(() => {
                const months = [...new Set(expenses.map(e => e.date.substring(0, 7)))];
                return months.sort((a, b) => a.localeCompare(b));
            }, [expenses]);

            // Auto-selecionar última data / mês disponível
            useEffect(() => {
                if (availableDates.length > 0 && (!selectedDate || !availableDates.includes(selectedDate))) {
                    setSelectedDate(availableDates[availableDates.length - 1]);
                }
            }, [availableDates, selectedDate]);

            useEffect(() => {
                if (availableMonths.length > 0 && (!selectedMonth || !availableMonths.includes(selectedMonth))) {
                    setSelectedMonth(availableMonths[availableMonths.length - 1]);
                }
            }, [availableMonths, selectedMonth]);

            // Navegação
            const handlePrevDate = useCallback(() => {
                const idx = availableDates.indexOf(selectedDate);
                if (idx > 0) setSelectedDate(availableDates[idx - 1]);
            }, [availableDates, selectedDate]);

            const handleNextDate = useCallback(() => {
                const idx = availableDates.indexOf(selectedDate);
                if (idx < availableDates.length - 1) setSelectedDate(availableDates[idx + 1]);
            }, [availableDates, selectedDate]);

            const handlePrevMonthFilter = useCallback(() => {
                const idx = availableMonths.indexOf(selectedMonth);
                if (idx > 0) setSelectedMonth(availableMonths[idx - 1]);
            }, [availableMonths, selectedMonth]);

            const handleNextMonthFilter = useCallback(() => {
                const idx = availableMonths.indexOf(selectedMonth);
                if (idx < availableMonths.length - 1) setSelectedMonth(availableMonths[idx + 1]);
            }, [availableMonths, selectedMonth]);

            // Filtro Principal
            const filteredExpenses = useMemo(() => {
                let filtered = expenses;
                
                if (searchTerm) {
                    const lowerSearch = searchTerm.toLowerCase();
                    return filtered.filter(ex => 
                        ex.description.toLowerCase().includes(lowerSearch) ||
                        ex.category.toLowerCase().includes(lowerSearch) ||
                        ex.store.toLowerCase().includes(lowerSearch) ||
                        (ex.notes && ex.notes.toLowerCase().includes(lowerSearch))
                    );
                }

                if (filterMode === 'month' && selectedMonth) {
                    filtered = filtered.filter(ex => ex.date.startsWith(selectedMonth));
                } else if (filterMode === 'day' && selectedDate) {
                    filtered = filtered.filter(ex => ex.date === selectedDate);
                }
                
                return filtered;
            }, [expenses, searchTerm, selectedDate, selectedMonth, filterMode]);

            const groupedExpenses = useMemo(() => {
                const groups = {};
                filteredExpenses.forEach(ex => {
                    const key = groupBy === 'date' ? ex.date : ex.store;
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(ex);
                });
                const sortedKeys = Object.keys(groups).sort((a, b) => {
                    if (groupBy === 'date') return b.localeCompare(a);
                    return a.localeCompare(b); 
                });
                return sortedKeys.map(key => ({
                    key, items: groups[key], total: groups[key].reduce((sum, item) => sum + item.amount, 0)
                }));
            }, [filteredExpenses, groupBy]);

            const totalsByStore = useMemo(() => {
                const acc = {};
                filteredExpenses.forEach(ex => { acc[ex.store] = (acc[ex.store] || 0) + ex.amount; });
                return acc;
            }, [filteredExpenses]);
            
            const totalGeneral = useMemo(() => filteredExpenses.reduce((sum, ex) => sum + ex.amount, 0), [filteredExpenses]);

            const getTotalTitle = useCallback(() => {
                if (searchTerm) return "(Busca)";
                if (filterMode === 'month') return `(Mês: ${formatMonthBR(selectedMonth)})`;
                return "(Do Dia)";
            }, [searchTerm, filterMode, selectedMonth]);
                        // --- RENDER ---
            return (
                <div className="pb-20 print:pb-0 min-h-screen">
                    <ToastContainer toasts={toasts} removeToast={id => setToasts(p => p.filter(t => t.id !== id))} />
                    
                    {showReminder && (
                        <PendingPaymentsAlert 
                            items={pendingItems} 
                            onClick={() => setCurrentView('calendar')} 
                            onClose={() => setShowReminder(false)}
                        />
                    )}

                    {/* HEADER */}
                    <div className="sticky top-0 z-50 no-print px-4 py-4">
                        <div className="max-w-5xl mx-auto">
                            <div className="glass-panel p-3 px-5 flex justify-between items-center rounded-2xl">
                                <div className="flex items-center gap-4">
                                    <WalletIcon3D />
                                    <div className="flex flex-col justify-center">
                                        <div className="flex items-center gap-3">
                                            <h1 className="font-bold text-slate-800 text-xl leading-tight">Despesas Miplace</h1>
                                            <div className="flex items-center gap-2 ml-4 border-l border-slate-300 pl-4">
                                                <button onClick={() => setCurrentView('dashboard')} className={`p-2 rounded-xl transition-all ${currentView === 'dashboard' ? 'bg-blue-100 text-blue-600 shadow-inner' : 'hover:bg-black/5 text-slate-400'}`} title="Início"><HomeIcon3D /></button>
                                                <button onClick={() => setCurrentView('calendar')} className={`p-2 rounded-xl transition-all ${currentView === 'calendar' ? 'bg-blue-100 text-blue-600 shadow-inner' : 'hover:bg-black/5 text-slate-400'}`} title="Calendário"><CalendarIcon3D /></button>
                                                <button onClick={() => setCurrentView('analytics')} className={`p-2 rounded-xl transition-all ${currentView === 'analytics' ? 'bg-blue-100 text-blue-600 shadow-inner' : 'hover:bg-black/5 text-slate-400'}`} title="Análise"><ChartIcon3D /></button>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            {settings.employeeName !== "Seu Nome" ? (
                                                <div className="flex items-center gap-2">
                                                    <span className="text-[10px] bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded-full font-bold border border-indigo-200 flex items-center gap-1">
                                                        <Icons.Globe className="w-3 h-3"/> {settings.employeeName} | V2
                                                    </span>
                                                    {syncStatus === 'synced' && <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.8)]" title="Online"></div>}
                                                    {syncStatus === 'syncing' && <div className="w-2 h-2 rounded-full bg-yellow-400 animate-pulse" title="Sincronizando..."></div>}
                                                    {syncStatus === 'error' && <Icons.WifiOff className="w-3 h-3 text-red-500" title="Erro de Conexão" />}
                                                </div>
                                            ) : (
                                                <span className="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-bold border border-red-200 animate-pulse">Offline (Configure seu Nome)</span>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setShowBackupOptions(true)} className="focus:outline-none transition-transform active:scale-95 p-1" title="Salvar Backup"><FloppyDiskIcon3D /></button>
                                    <button onClick={() => setIsSettingsOpen(true)} className="focus:outline-none transition-transform active:scale-95 p-1" title="Configurações"><SettingsIcon3D /></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* INPUT OCULTO DE RESTORE */}
                    <input type="file" ref={fileInputRef} onChange={handleRestoreFile} accept=".json" className="hidden" />

                    {/* CONTEÚDO PRINCIPAL */}
                    <div className="max-w-5xl mx-auto px-6 space-y-8 mt-4">
                        
                        {currentView === 'calendar' ? (
                            <ExpenseCalendar checkedState={calendarChecks} onToggleCheck={handleCalendarCheckToggle} showToast={showToast} />
                        ) : currentView === 'analytics' ? (
                            <AnalyticsDashboard expenses={expenses} currency={settings.currency} formatCurrency={formatCurrency} />
                        ) : (
                            <>
                                {/* CARDS POR LOJA */}
                                {expenses.length > 0 && (
                                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 no-print fade-in">
                                        {Object.entries(totalsByStore).sort((a, b) => b[1] - a[1]).map(([storeName, val]) => (
                                            <div key={storeName} className="glass-panel p-4 rounded-2xl hover:translate-y-[-4px] transition-transform duration-300">
                                                <div className="flex items-center gap-2 mb-2">
                                                    <img src={STORE_IMAGES[storeName] || STORE_IMAGES["default"]} alt={storeName} className="w-6 h-6 rounded-full" />
                                                    <span className="text-[10px] uppercase font-bold text-slate-400 truncate block tracking-wide">{storeName}</span>
                                                </div>
                                                <span className="text-xl font-bold text-slate-700 block mb-3">{settings.currency} {formatCurrency(val)}</span>
                                                <div className={`h-1.5 w-full rounded-full bg-gradient-to-r opacity-80 ${getStoreBarColor(storeName)}`}></div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {/* FORMULÁRIO */}
                                <div className="glass-panel rounded-3xl overflow-hidden no-print">
                                    <div className="p-8">
                                        <div className="flex justify-between items-center mb-8">
                                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-4">
                                                {editingId ? (
                                                    <div className="p-2.5 rounded-xl shadow-md bg-orange-100 text-orange-600"><Icons.Edit className="w-6 h-6"/></div>
                                                ) : (
                                                    <FastForwardIcon3D />
                                                )}
                                                {editingId ? "Editar Lançamento" : "Novo Lançamento"}
                                            </h2>
                                            {editingId && (
                                                <button onClick={cancelEdit} className="bg-white/50 border border-white/60 px-4 py-2 rounded-xl text-xs font-bold text-slate-500 hover:text-red-500 transition-colors">Cancelar</button>
                                            )}
                                        </div>

                                        <form onSubmit={handleSubmit} className="space-y-6">
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <div className="space-y-2">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wide ml-1">Data</label>
                                                    <DateInput required value={date} onChange={e => setDate(e.target.value)} className="liquid-input w-full px-5 py-3.5 rounded-xl text-slate-700 font-semibold" />
                                                </div>
                                                <div className="space-y-2">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wide ml-1">Categoria</label>
                                                    <div className="relative group">
                                                        <select required value={category} onChange={e => setCategory(e.target.value)} className="liquid-input w-full px-5 py-3.5 rounded-xl appearance-none text-slate-700 font-semibold cursor-pointer">
                                                            <option value="" disabled>Selecione...</option>
                                                            {settings.categories.map((c, i) => <option key={i} value={c.label}>{c.label}</option>)}
                                                        </select>
                                                        <div className="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 group-hover:text-blue-500 transition-colors"><Icons.Tag className="w-4 h-4" /></div>
                                                    </div>
                                                </div>
                                                <div className="space-y-2 md:col-span-2">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wide ml-1">Descrição</label>
                                                    <input type="text" required placeholder="Ex: Café com cliente" value={description} onChange={e => setDescription(e.target.value)} className="liquid-input w-full px-5 py-3.5 rounded-xl text-slate-700 font-semibold placeholder-slate-400" />
                                                </div>
                                                <div className="space-y-2">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wide ml-1">Loja / Grupo</label>
                                                    <div className="relative group">
                                                        <select required value={store} onChange={e => setStore(e.target.value)} className="liquid-input w-full px-5 py-3.5 rounded-xl appearance-none text-slate-700 font-semibold cursor-pointer">
                                                            <option value="" disabled>Selecione...</option>
                                                            {STORES_LIST.map((l, i) => <option key={i} value={l}>{l}</option>)}
                                                        </select>
                                                        <div className="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 group-hover:text-blue-500 transition-colors"><Icons.Store className="w-4 h-4" /></div>
                                                    </div>
                                                    {!editingId && store.includes("Piracicaba") && <p className="text-[10px] text-red-500 font-bold px-3 pt-1 animate-pulse">* Divide por 3</p>}
                                                    {!editingId && store.includes("Amparo") && <p className="text-[10px] text-pink-500 font-bold px-3 pt-1 animate-pulse">* Divide por 2</p>}
                                                    {!editingId && store === "Todas" && <p className="text-[10px] text-green-600 font-bold px-3 pt-1 animate-pulse">* Divide por 5</p>}
                                                </div>
                                                <div className="space-y-2">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wide ml-1">Valor ({settings.currency})</label>
                                                    <div className="relative group">
                                                        <input type="text" inputMode="numeric" required placeholder="0,00" value={amount} onChange={handleAmountChange} className="liquid-input w-full pl-5 pr-12 py-3.5 rounded-xl text-slate-700 font-bold text-lg" />
                                                        <div className="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 group-hover:text-blue-500 transition-colors"><Icons.DollarSign className="w-4 h-4" /></div>
                                                    </div>
                                                </div>
